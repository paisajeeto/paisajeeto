<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Turbo Racer — Rupiyo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#0a0a18; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; max-width:520px; margin:0 auto; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:12px 14px; pointer-events:none; z-index:3; }
  #scoreBox { font-size:40px; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.4); }
  #bestBox { font-size:13px; font-weight:700; background:rgba(0,0,0,.35); padding:6px 12px; border-radius:999px; }
  #muteBtn { pointer-events:auto; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25); color:#fff; width:42px; height:42px; border-radius:50%; font-size:19px; cursor:pointer; }
  #chips { position:absolute; top:64px; left:0; right:0; display:flex; justify-content:center; gap:8px; z-index:3; pointer-events:none; }
  .chip { font-size:15px; font-weight:800; background:rgba(0,0,0,.4); padding:6px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.18); }
  #centerMsg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:4; pointer-events:none; text-align:center; padding:20px; }
  #countNum { font-size:110px; font-weight:800; color:#f5c542; text-shadow:0 5px 0 #b97e00, 0 10px 30px rgba(0,0,0,.5); display:none; }
  .panel { background:rgba(13,16,22,.92); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:26px 30px; pointer-events:auto; box-shadow:0 18px 50px rgba(0,0,0,.55); max-width:86%; }
  .panel h1 { font-size:30px; margin-bottom:4px; }
  .panel h1 span { color:#22d3ee; }
  .panel .sub { opacity:.75; font-size:14px; line-height:1.5; margin-bottom:14px; }
  .panel .bigscore { font-size:52px; font-weight:800; color:#f5c542; line-height:1; }
  .panel .bestline { font-size:14px; opacity:.8; margin:6px 0 16px; }
  .btn { display:inline-block; border:none; cursor:pointer; font-weight:800; border-radius:14px; padding:14px 26px; font-size:17px; background:linear-gradient(135deg,#22d3ee,#7c3aed); color:#fff; box-shadow:0 5px 14px rgba(0,0,0,.35); }
  .btn:active { transform:scale(.96); }
  .hidden { display:none !important; }

  /* Tutorial hand hint (owner, 2026-11-10): a looping hand overlay that
     demonstrates this game's primary input — the same help Bag Toss has
     always drawn for its throw. It never blocks input (pointer-events:
     none), shows from the start screen, hides for the rest of a run on
     the player's first meaningful input, and comes back on a new run
     only when the previous run had fewer than 3 inputs (the player is
     still learning). hhRunStart() is called by the game's own start
     function; visibility is the .hhOn class. */
  #handHint { position:fixed; z-index:60; pointer-events:none; display:none; font-size:56px; line-height:1; left:50%; margin-left:-28px; top:62%; filter:drop-shadow(0 3px 6px rgba(0,0,0,.55)); will-change:transform; }
  #handHint.hhOn { display:block; }
  #handHint.hhTap { animation:hhTapK 1.15s ease-in-out infinite; }
  @keyframes hhTapK { 0%,100% { transform:translateY(0) scale(1); } 35% { transform:translateY(10px) scale(.86); } 55% { transform:translateY(10px) scale(.86); } }
  #handHint.hhHold { animation:hhHoldK 1.9s ease-in-out infinite; }
  @keyframes hhHoldK { 0%,100% { transform:translateY(0); } 22% { transform:translateY(12px); } 68% { transform:translateY(12px); } }
  #handHint.hhSteer { animation:hhSteerK 1.7s ease-in-out infinite alternate; }
  @keyframes hhSteerK { from { transform:translateX(-48px); } to { transform:translateX(48px); } }
  #handHint.hhDrag { top:auto; bottom:15%; animation:hhSteerK 1.6s ease-in-out infinite alternate; }
  #handHint.hhTrace { animation:hhTraceK 2.2s linear infinite; }
  @keyframes hhTraceK { 0% { transform:translate(0,0); } 25% { transform:translate(30px,-10px); } 50% { transform:translate(4px,-26px); } 75% { transform:translate(-28px,-10px); } 100% { transform:translate(0,0); } }
  #handHint.hhPull { left:20%; margin-left:0; top:54%; animation:hhPullK 1.8s ease-in-out infinite; }
  @keyframes hhPullK { 0%,100% { transform:translate(0,0); } 45% { transform:translate(-32px,44px); } 60% { transform:translate(-32px,44px); } 74% { transform:translate(6px,-6px); } }
  #handHint.hhConnect { animation:hhConnectK 2s ease-in-out infinite; }
  @keyframes hhConnectK { 0%,100% { transform:translateX(-54px); } 12% { transform:translateX(-54px); } 55% { transform:translateX(54px); } 70% { transform:translateX(54px); } }
  #handHint.hhRight { left:auto; right:11%; margin-left:0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="scoreBox">0</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div id="bestBox">🏆 0</div>
      <button id="muteBtn" title="Sound on/off">🔊</button>
    </div>
  </div>
  <div id="chips">
    <div class="chip" id="livesBox">❤️❤️❤️</div>
    <div class="chip" id="spdBox">0 km/h</div>
    <div class="chip" id="comboBox">🔥 Near-miss ×0</div>
  </div>
  <div id="centerMsg">
    <div id="countNum">3</div>
    <div class="panel" id="startPanel">
      <h1>🏎️ Turbo <span>Racer</span></h1>
      <div class="sub">Drag left / right to steer through traffic!<br>Grab coins 🪙, skim past cars for NEAR MISS bonuses.<br>You have 3 crashes — don't use them all!</div>
      <button class="btn" id="startBtn">▶ Play</button>
    </div>
    <div class="panel hidden" id="overPanel">
      <h1>Game Over</h1>
      <div class="bigscore" id="finalScore">0</div>
      <div class="bestline" id="finalBest">Best: 0</div>
      <button class="btn" id="againBtn">↻ Race Again</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============ Rupiyo score bridge ============ */
var GAME_ID = 'turbo-racer';
try { GAME_ID = new URLSearchParams(location.search).get('rp_game') || GAME_ID; } catch (e) {}
var scoreSent = false;
function reportScore(s) {
  if (scoreSent) return; scoreSent = true;
  s = Math.max(0, Math.floor(s));
  try { parent.postMessage({ type: 'rupiyo:score', game: GAME_ID, score: s }, '*'); } catch (e) {}
  try { if (window.RupiyoBridge && window.RupiyoBridge.postScore) window.RupiyoBridge.postScore(s); } catch (e) {}
}

/* ============ Interstitial ad helper ============ */
function rpAd(cb){ if(window.parent===window){ cb(); return; } var done=false; var fin=function(){ if(done) return; done=true; window.removeEventListener('message',h); cb(); }; var h=function(e){ if(e.data && e.data.type==='rupiyo:ad-done') fin(); }; window.addEventListener('message',h); try{ parent.postMessage({type:'rupiyo:ad',kind:'interstitial'},'*'); }catch(_){ } setTimeout(fin,5000); }
var restartQueued = false;
function queueRestart() {
  if (restartQueued) return; restartQueued = true;
  rpAd(function () { restartQueued = false; startCountdown(); });
}

/* ============ Audio (all synthesized) ============ */
var AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted) return; var c = ac(); if (!c) return;
  var t0 = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol, freq) {
  if (muted) return; var c = ac(); if (!c) return;
  var n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1200; f.Q.value = 0.8;
  var g = c.createGain(); g.gain.value = vol || 0.2;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
}
function sfxCoin() { tone(950, 0.07, 'square', 0.10); tone(1420, 0.14, 'square', 0.10, null, 0.06); }
function sfxNear(combo) { tone(520 + combo * 45, 0.09, 'triangle', 0.13, 760 + combo * 45); noiseBurst(0.14, 0.07, 2400); }
function sfxCrash() { noiseBurst(0.4, 0.34, 260); tone(150, 0.42, 'sawtooth', 0.18, 38); }
function sfxCount(final) { tone(final ? 880 : 440, final ? 0.22 : 0.12, 'sine', 0.14); }
function sfxEnd() { tone(392, 0.16, 'sine', 0.12); tone(330, 0.16, 'sine', 0.12, null, 0.15); tone(262, 0.34, 'sine', 0.13, null, 0.3); }
/* subtle engine hum */
var engOsc = null, engGain = null;
function engineStart() {
  if (engOsc) return; var c = ac(); if (!c) return;
  try {
    engOsc = c.createOscillator(); engGain = c.createGain();
    var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 300;
    engOsc.type = 'sawtooth'; engOsc.frequency.value = 55; engGain.gain.value = 0;
    engOsc.connect(f); f.connect(engGain); engGain.connect(c.destination); engOsc.start();
  } catch (e) { engOsc = null; engGain = null; }
}
function engineSet(on, freq) {
  if (!engOsc || !engGain) return;
  try { engGain.gain.value = (on && !muted) ? 0.026 : 0; engOsc.frequency.value = freq; } catch (e) {}
}
function engineStop() { if (engOsc) { try { engOsc.stop(); } catch (e) {} engOsc = null; engGain = null; } }

/* ============ Canvas setup ============ */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============ Game state ============ */
var state = 'ready'; // ready | count | play | over
var countT = 0, lastCount = 4;
var score = 0, scoreF = 0, best = 0;
try { best = parseInt(localStorage.getItem('rp_best_' + GAME_ID) || '0', 10) || 0; } catch (e) {}
var time = 0, shake = 0, overAt = 0;
var player, traffic, coins, parts, pops;
var scroll, scrollOff, elapsed, lives, combo, invT, spawnT, coinT, steerX, steerOn, keyL, keyR;
var laneChangeT = 2.2; // anti-autopilot scheduler (see laneChangeTick)
var TRAFFIC_COLORS = ['#ff5d5d', '#ff9f43', '#4dc3ff', '#b6ff5e', '#e08bff', '#ff7ac2', '#5effd4'];

function roadX() { return W * 0.09; }
function roadW() { return W * 0.82; }
function laneCX(i) { return roadX() + roadW() * (i + 0.5) / 4; }

function reset() {
  player = { x: W / 2, y: 0, w: 48, h: 80, tilt: 0, vx: 0 };
  player.y = H * 0.76;
  traffic = []; coins = []; parts = []; pops = [];
  scroll = 430; scrollOff = 0; elapsed = 0;
  lives = 3; combo = 0; invT = 0;
  spawnT = 0.6; coinT = 0.4;
  laneChangeT = 2.2;
  score = 0; scoreF = 0; scoreSent = false;
  steerX = W / 2; steerOn = false; keyL = false; keyR = false;
  updateHud();
}
function updateHud() {
  document.getElementById('scoreBox').textContent = score;
  document.getElementById('bestBox').textContent = '🏆 ' + Math.max(best, score);
  var hearts = '';
  for (var i = 0; i < lives; i++) hearts += '❤️';
  document.getElementById('livesBox').textContent = hearts || '💔';
  document.getElementById('spdBox').textContent = Math.round(scroll * 0.16) + ' km/h';
  document.getElementById('comboBox').textContent = '🔥 Near-miss ×' + combo;
}
function burst(x, y, n, colors, spd) {
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2, v = (0.3 + Math.random() * 0.7) * (spd || 260);
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.55 + Math.random() * 0.4, t: 0, c: colors[i % colors.length], r: 2.5 + Math.random() * 3.5 });
  }
}
function popup(x, y, txt, color) { pops.push({ x: x, y: y, txt: txt, t: 0, c: color || '#ffd94d' }); }

/* ============ Spawn slots — the REAL autopilot fix (owner, 2026-11-09) ====
   Root cause of the centre-line autopilot: traffic used to spawn ONLY on
   the 4 lane centres, while car width is a fixed 48px and the collision
   box is shrunk (x0.78 → contact distance ~37px). Lane width scales with
   the screen (roadW/4), so a divider line sits roadW/8 = ~41–53px from
   each neighbouring lane centre — beyond contact distance. A player
   parked exactly on a divider was therefore mathematically untouchable,
   and the ≥300 lane changes could not fix it (rare, and a change may
   never START within 260px of the player).
   Fix: traffic now spawns on 7 slots — the 4 lane centres PLUS the 3
   divider lines between them. Every fixed x on the road is within
   roadW/16 (~21–33px) of a slot, i.e. inside contact distance of that
   slot's cars, so NO parked position is permanently safe at any score.
   Fairness: spawns are still one car at a time, the entry guards below
   stop fresh side-by-side walls forming at the top, and each car's
   speed factor differs, so rows shear apart — a survivable gap always
   exists somewhere; it just keeps moving. */
function slotX(k) { return roadX() + roadW() * (k + 1) / 8; } // k = 0..6; even k = lane centre (lane k/2), odd k = divider line
function spawnTraffic() {
  var k;
  if (Math.random() < 0.38) k = 1 + 2 * Math.floor(Math.random() * 3); // a divider slot (1, 3, 5)
  else k = 2 * Math.floor(Math.random() * 4);                          // a lane-centre slot (0, 2, 4, 6)
  var hx = slotX(k) + (Math.random() - 0.5) * 6;
  for (var i = 0; i < traffic.length; i++) {
    var o = traffic[i];
    if (Math.abs(o.hx - hx) < 34 && o.y < 190) return; // keep this slot's entry clear
    if (Math.abs(o.hx - hx) < 58 && o.y < 120) return; // no fresh wall: same/adjacent slot still near the spawn line
  }
  /* Fairness valve (strong form): at least one slot must ALWAYS have no
     car anywhere above the player — a permanent escape gap. Spawns are
     the only way cars appear, so a spawn into the last car-free slot is
     skipped (lane changes are barred from taking it too, see
     laneChangeTick). Which slot is free keeps changing as cars pass the
     player, so the gap moves and parking is still death — the player
     just always has somewhere to go. */
  var cntA = [0, 0, 0, 0, 0, 0, 0];
  for (var j = 0; j < traffic.length; j++) {
    var t = traffic[j];
    if (t.y > player.y + 68) continue; // already passed the player
    for (var s = 0; s < 7; s++) {
      if (Math.abs(t.x - slotX(s)) < 38) cntA[s]++;
      if (t.lc && Math.abs(t.lc.toX - slotX(s)) < 38) cntA[s]++;
    }
  }
  if (cntA[k] === 0) {
    var zerosA = 0;
    for (var s2 = 0; s2 < 7; s2++) if (cntA[s2] === 0) zerosA++;
    if (zerosA === 1) return; // this spawn would close the last gap — skip it
  }
  traffic.push({
    lane: Math.floor(k / 2), div: (k % 2 === 1), hx: hx, x: hx, y: -70,
    w: 48, h: 80, f: 0.42 + Math.random() * 0.22,
    c: TRAFFIC_COLORS[Math.floor(Math.random() * TRAFFIC_COLORS.length)],
    passed: false, wob: Math.random() * 9,
    lc: null, lcCd: 0 // lane-change state: lc = {from,to,t,fromX,toX} while drifting, lcCd = per-car cooldown (s)
  });
}

/* ============ Lane changes (owner, 2026-11-09) ============
   Extra pressure on top of the slot spawns above: from 300 points,
   lane-centre traffic starts changing lanes — one car at a time,
   drifting smoothly into an adjacent lane over ~0.6s (never a
   teleport). Fairness guards: a change may only START when the car is
   well clear of the player (> 260px vertically), the target spot must
   be free (no car there or heading there within 150px vertically, so
   an escape always exists), and each car rests on a cooldown after a
   change. Divider-slot cars never change lanes — holding the line is
   exactly their job. Below 300 points nothing here runs. */
function laneChangeTick(dt) {
  if (score < 300) return;
  laneChangeT -= dt;
  if (laneChangeT > 0) return;
  laneChangeT = 1.6 + Math.random() * 1.4; // next attempt in ~1.6–3.0s
  var elig = [];
  for (var i = 0; i < traffic.length; i++) {
    var c = traffic[i];
    if (c.div || c.lc || c.lcCd > 0) continue;           // divider cars hold their line; one change at a time per car, then a rest
    if (Math.abs(c.y - player.y) <= 260) continue;       // never start a change near the player
    elig.push(c);
  }
  if (!elig.length) return;
  var car = elig[(Math.random() * elig.length) | 0];
  var dirs = [];
  if (car.lane > 0) dirs.push(-1);
  if (car.lane < 3) dirs.push(1);
  if (dirs.length === 2 && Math.random() < 0.5) dirs.reverse();
  for (var d = 0; d < dirs.length; d++) {
    var to = car.lane + dirs[d], blocked = false;
    for (var j = 0; j < traffic.length; j++) {
      var o = traffic[j];
      if (o === car) continue;
      var oLane = o.lc ? o.lc.to : o.lane;
      if (oLane === to && Math.abs(o.y - car.y) < 150) { blocked = true; break; } // never change into an occupied spot
    }
    if (!blocked) {
      /* Never lane-change INTO the last car-free slot above the player —
         that slot is the guaranteed escape gap (see spawnTraffic). The
         changing car itself is excluded from the counts: its own slot
         becomes free as it leaves, so the gap survives the move. */
      var cntL = [0, 0, 0, 0, 0, 0, 0];
      for (var m = 0; m < traffic.length; m++) {
        var q = traffic[m];
        if (q === car || q.y > player.y + 68) continue;
        for (var s3 = 0; s3 < 7; s3++) {
          if (Math.abs(q.x - slotX(s3)) < 38) cntL[s3]++;
          if (q.lc && Math.abs(q.lc.toX - slotX(s3)) < 38) cntL[s3]++;
        }
      }
      var zerosL = 0, zeroIsTarget = false;
      for (var s4 = 0; s4 < 7; s4++) if (cntL[s4] === 0) { zerosL++; if (s4 === to * 2) zeroIsTarget = true; }
      if (zeroIsTarget && zerosL === 1) continue;
      car.lc = { from: car.lane, to: to, t: 0, fromX: car.hx, toX: laneCX(to) }; return;
    }
  }
}
function spawnCoin() {
  var lane = Math.floor(Math.random() * 4);
  coins.push({ x: laneCX(lane), y: -24, r: 14, taken: false });
}
function crash(car) {
  lives--;
  combo = 0;
  invT = 1.7;
  shake = 16;
  burst(player.x, player.y - 10, 30, ['#ff922b', '#ff5d5d', '#ffd94d', '#ffffff'], 340);
  burst(car.x, car.y, 16, ['#ced4da', '#868e96'], 240);
  sfxCrash();
  updateHud();
  if (lives <= 0) { gameOver(); }
}
function startCountdown() {
  if (typeof hhRunStart === 'function') hhRunStart();   // tutorial hand: a new run begins
  reset();
  state = 'count'; countT = 0; lastCount = 4;
  document.getElementById('startPanel').classList.add('hidden');
  document.getElementById('overPanel').classList.add('hidden');
  document.getElementById('countNum').style.display = 'block';
  ac(); engineStart();
}
function gameOver() {
  if (state === 'over') return;
  state = 'over'; overAt = time;
  shake = 18;
  burst(player.x, player.y, 40, ['#ff922b', '#ff5d5d', '#ffd94d'], 380);
  engineStop(); sfxEnd();
  if (score > best) { best = score; try { localStorage.setItem('rp_best_' + GAME_ID, String(best)); } catch (e) {} }
  reportScore(score);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = 'Best: ' + best;
  setTimeout(function () { document.getElementById('overPanel').classList.remove('hidden'); }, 450);
  updateHud();
}

/* ============ Update ============ */
function update(dt) {
  time += dt;
  var i, p, c;
  for (i = parts.length - 1; i >= 0; i--) { p = parts[i]; p.t += dt; p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) parts.splice(i, 1); }
  for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; pops[i].y -= 46 * dt; if (pops[i].t > 0.9) pops.splice(i, 1); }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  engineSet(state === 'play' || state === 'count', 48 + scroll * 0.055);

  if (state === 'count') {
    countT += dt;
    scrollOff += 120 * dt;
    var n = 3 - Math.floor(countT);
    if (n !== lastCount && n >= 1) { lastCount = n; sfxCount(false); var el = document.getElementById('countNum'); el.textContent = n; el.style.transform = 'scale(1.25)'; setTimeout(function () { el.style.transform = 'scale(1)'; }, 90); }
    if (countT >= 3) { state = 'play'; document.getElementById('countNum').style.display = 'none'; sfxCount(true); }
    return;
  }
  if (state !== 'play') { scrollOff += 60 * dt; return; }

  elapsed += dt;
  scroll = Math.min(920, 430 + elapsed * 7.5);
  scrollOff += scroll * dt;
  scoreF += dt * 2; // 1 distance point per ~0.5s
  if (Math.floor(scoreF) !== score) { score = Math.floor(scoreF); updateHud(); }

  // steering
  if (keyL) steerX -= 560 * dt;
  if (keyR) steerX += 560 * dt;
  var minX = roadX() + player.w / 2 + 4, maxX = roadX() + roadW() - player.w / 2 - 4;
  steerX = Math.max(minX, Math.min(maxX, steerX));
  var prevX = player.x;
  player.x += (steerX - player.x) * Math.min(1, dt * 13);
  player.vx = dt > 0 ? (player.x - prevX) / dt : 0;
  player.tilt = Math.max(-0.16, Math.min(0.16, player.vx * 0.00045));
  player.y = H * 0.76 + Math.sin(time * 21) * 1.2; // engine judder
  if (invT > 0) invT -= dt;

  // spawning
  spawnT -= dt;
  if (spawnT <= 0) { spawnTraffic(); spawnT = Math.max(0.42, 0.92 - elapsed * 0.008) * (0.75 + Math.random() * 0.5); }
  coinT -= dt;
  if (coinT <= 0) { spawnCoin(); coinT = 0.55 + Math.random() * 0.9; }

  laneChangeTick(dt);

  // traffic
  for (i = traffic.length - 1; i >= 0; i--) {
    c = traffic[i];
    c.y += scroll * (1 - c.f) * dt;
    if (c.lcCd > 0) c.lcCd -= dt;
    if (c.lc) {
      // mid lane change: drift smoothly (smoothstep) between the two slot positions
      c.lc.t += dt / 0.6;
      var lp = Math.min(1, c.lc.t), le = lp * lp * (3 - 2 * lp);
      c.x = c.lc.fromX + (c.lc.toX - c.lc.fromX) * le + Math.sin(time * 1.7 + c.wob) * 3;
      if (lp >= 1) { c.lane = c.lc.to; c.hx = c.lc.toX; c.lc = null; c.lcCd = 4; }
    } else {
      c.x = c.hx + Math.sin(time * 1.7 + c.wob) * 3;
    }
    if (c.y - c.h / 2 > H + 30) { traffic.splice(i, 1); continue; }
    // passed the player?
    if (!c.passed && c.y - c.h / 2 > player.y + player.h / 2) {
      c.passed = true;
      var gap = Math.abs(c.x - player.x) - (c.w + player.w) / 2;
      if (gap >= 0 && gap < 26 && invT <= 0) {
        combo++;
        scoreF += 1;
        score = Math.floor(scoreF);
        popup(player.x, player.y - player.h / 2 - 26, 'NEAR MISS! +1', '#5effd4');
        sfxNear(combo);
        updateHud();
      } else if (gap >= 26) { combo = 0; document.getElementById('comboBox').textContent = '🔥 Near-miss ×0'; }
    }
    // collision (shrunk AABB)
    if (invT <= 0 &&
        Math.abs(c.x - player.x) < (c.w + player.w) / 2 * 0.78 &&
        Math.abs(c.y - player.y) < (c.h + player.h) / 2 * 0.86) {
      traffic.splice(i, 1);
      crash(c);
      if (state !== 'play') return;
    }
  }
  // coins
  for (i = coins.length - 1; i >= 0; i--) {
    var cn = coins[i];
    cn.y += scroll * dt;
    if (cn.y > H + 30) { coins.splice(i, 1); continue; }
    var dx = cn.x - player.x, dy = cn.y - player.y;
    if (dx * dx + dy * dy < (cn.r + 36) * (cn.r + 36)) {
      coins.splice(i, 1);
      scoreF += 1; score = Math.floor(scoreF);
      popup(cn.x, cn.y - 18, '+1 🪙');
      burst(cn.x, cn.y, 8, ['#ffd94d', '#fff3b0'], 150);
      sfxCoin(); updateHud();
    }
  }
}

/* ============ Draw ============ */
function drawCoinShape(x, y, r, t) {
  var sq = Math.abs(Math.cos(t * 4.5));
  ctx.save(); ctx.translate(x, y); ctx.scale(0.35 + 0.65 * sq, 1);
  var g = ctx.createRadialGradient(-3, -4, 2, 0, 0, r);
  g.addColorStop(0, '#fff3b0'); g.addColorStop(0.6, '#f5c542'); g.addColorStop(1, '#d99400');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.strokeStyle = '#a86e00'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#a86e00'; ctx.font = '800 ' + Math.round(r * 1.05) + 'px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('₹', 0, 1);
  ctx.restore();
}
function drawCar(x, y, w, h, color, flip, tilt, isPlayer) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt || 0);
  if (flip) ctx.scale(1, -1);
  // wheels
  ctx.fillStyle = '#101218';
  rr(-w / 2 - 4, -h * 0.34, 9, 18, 3); ctx.fill();
  rr(w / 2 - 5, -h * 0.34, 9, 18, 3); ctx.fill();
  rr(-w / 2 - 4, h * 0.16, 9, 18, 3); ctx.fill();
  rr(w / 2 - 5, h * 0.16, 9, 18, 3); ctx.fill();
  // body
  var g = ctx.createLinearGradient(-w / 2, 0, w / 2, 0);
  g.addColorStop(0, color); g.addColorStop(0.5, '#ffffff22'); g.addColorStop(0.52, color); g.addColorStop(1, color);
  ctx.fillStyle = color;
  rr(-w / 2, -h / 2, w, h, 13); ctx.fill();
  ctx.fillStyle = g; rr(-w / 2, -h / 2, w, h, 13); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2; rr(-w / 2, -h / 2, w, h, 13); ctx.stroke();
  // hood shine
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  rr(-w * 0.30, -h * 0.47, w * 0.20, h * 0.24, 6); ctx.fill();
  // windshield (front is -y)
  ctx.fillStyle = 'rgba(170,225,255,.95)';
  rr(-w * 0.34, -h * 0.15, w * 0.68, h * 0.22, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  rr(-w * 0.34, -h * 0.15, w * 0.30, h * 0.22, 6); ctx.fill();
  // cabin + rear window
  ctx.fillStyle = 'rgba(20,24,38,.85)';
  rr(-w * 0.32, h * 0.10, w * 0.64, h * 0.30, 7); ctx.fill();
  ctx.fillStyle = 'rgba(140,190,230,.9)';
  rr(-w * 0.28, h * 0.30, w * 0.56, h * 0.13, 5); ctx.fill();
  // racing stripe (player)
  if (isPlayer) { ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.fillRect(-3.5, -h / 2 + 3, 7, h * 0.30); ctx.fillRect(-3.5, h * 0.44, 7, h * 0.05); }
  // headlights (front)
  ctx.fillStyle = '#fff6bf';
  ctx.beginPath(); ctx.arc(-w * 0.30, -h / 2 + 4, 4, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(w * 0.30, -h / 2 + 4, 4, 0, 7); ctx.fill();
  // tail lights
  ctx.fillStyle = '#ff3b3b';
  ctx.fillRect(-w * 0.36, h / 2 - 6, 9, 4); ctx.fillRect(w * 0.36 - 9, h / 2 - 6, 9, 4);
  ctx.restore();
}
function buildingHash(n) { var x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
function drawCity(side) { // side: -1 left, 1 right
  var bw = roadX() - 6;
  var segH = 120, off = (scrollOff * 0.55) % segH;
  for (var y = -segH + off; y < H + segH; y += segH) {
    var idx = Math.floor((y + scrollOff * 0.55) / segH) + (side > 0 ? 500 : 0);
    var bh = 0.55 + buildingHash(idx) * 0.4;
    var x0 = side < 0 ? 2 : W - bw - 2;
    ctx.fillStyle = '#141230';
    ctx.fillRect(x0, y + segH * (1 - bh), bw - 4, segH * bh);
    // lit windows
    ctx.fillStyle = 'rgba(255,214,120,.75)';
    for (var wy = 0; wy < 3; wy++) for (var wx = 0; wx < 2; wx++) {
      if (buildingHash(idx * 7 + wy * 3 + wx) > 0.45) ctx.fillRect(x0 + 6 + wx * (bw / 2 - 4), y + segH * (1 - bh) + 8 + wy * 16, 6, 8);
    }
    // neon sign dot
    ctx.fillStyle = side < 0 ? 'rgba(34,211,238,.9)' : 'rgba(255,92,246,.9)';
    ctx.beginPath(); ctx.arc(x0 + bw / 2 - 2, y + segH * (1 - bh) + 4, 3, 0, 7); ctx.fill();
  }
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  var i;
  // night city backdrop
  var sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#0a0a24'); sky.addColorStop(1, '#1d1440');
  ctx.fillStyle = sky; ctx.fillRect(-20, -20, W + 40, H + 40);
  drawCity(-1); drawCity(1);
  var rx = roadX(), rw = roadW();
  // road
  var rg = ctx.createLinearGradient(rx, 0, rx + rw, 0);
  rg.addColorStop(0, '#23232e'); rg.addColorStop(0.5, '#33333f'); rg.addColorStop(1, '#23232e');
  ctx.fillStyle = rg; ctx.fillRect(rx, -20, rw, H + 40);
  // rumble strips
  var stripH = 34, soff = scrollOff % (stripH * 2);
  for (var y = -stripH * 2 + soff; y < H + stripH; y += stripH) {
    ctx.fillStyle = (Math.floor((y + scrollOff) / stripH) % 2 === 0) ? '#e63946' : '#f1f3f5';
    ctx.fillRect(rx - 9, y, 7, stripH); ctx.fillRect(rx + rw + 2, y, 7, stripH);
  }
  // neon edges
  ctx.save();
  ctx.shadowBlur = 14;
  ctx.shadowColor = '#22d3ee'; ctx.fillStyle = '#22d3ee'; ctx.fillRect(rx - 2, -20, 3.5, H + 40);
  ctx.shadowColor = '#ff5cf6'; ctx.fillStyle = '#ff5cf6'; ctx.fillRect(rx + rw - 1.5, -20, 3.5, H + 40);
  ctx.restore();
  // lane dashes
  ctx.fillStyle = 'rgba(255,235,160,.85)';
  var dashH = 44, gapH = 34, doff = scrollOff % (dashH + gapH);
  for (var l = 1; l < 4; l++) {
    var lx = rx + rw * l / 4;
    for (var dy = -dashH - gapH + doff; dy < H + dashH; dy += dashH + gapH) {
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(lx - 3, dy, 6, dashH, 3); ctx.fill(); }
      else ctx.fillRect(lx - 3, dy, 6, dashH);
    }
  }
  // speed streaks at high speed
  if (state === 'play' && scroll > 640) {
    ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 2;
    for (i = 0; i < 6; i++) {
      var sx = rx + buildingHash(i * 31 + Math.floor(time * 7)) * rw;
      var sy = ((time * scroll * 1.6 + i * 173) % (H + 120)) - 60;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx, sy + 52); ctx.stroke();
    }
  }
  // coins
  for (i = 0; i < coins.length; i++) drawCoinShape(coins[i].x, coins[i].y, coins[i].r, time + coins[i].x * 0.01);
  // traffic (facing down toward player)
  for (i = 0; i < traffic.length; i++) drawCar(traffic[i].x, traffic[i].y, traffic[i].w, traffic[i].h, traffic[i].c, true, 0, false);
  // player (blinks while invincible)
  var blink = invT > 0 && Math.floor(time * 12) % 2 === 0;
  if (state !== 'over' && !blink) drawCar(player.x, player.y, player.w, player.h, '#ffd60a', false, player.tilt, true);
  if (invT > 0 && state === 'play') {
    ctx.strokeStyle = 'rgba(94,255,212,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(player.x, player.y, 58 + Math.sin(time * 10) * 3, 0, 7); ctx.stroke();
  }
  // particles
  for (i = 0; i < parts.length; i++) { var q = parts[i]; ctx.globalAlpha = Math.max(0, 1 - q.t / q.life); ctx.fillStyle = q.c; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < pops.length; i++) { var pp = pops[i]; ctx.globalAlpha = 1 - pp.t / 0.9; ctx.font = '800 21px system-ui, sans-serif'; ctx.fillStyle = pp.c; ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 4; ctx.strokeText(pp.txt, pp.x, pp.y); ctx.fillText(pp.txt, pp.x, pp.y); }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ============ Loop ============ */
var lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000; lastT = ts;
  if (dt > 0.05) dt = 0.05;
  if (!document.hidden) { update(dt); draw(); }
}

/* ============ Input ============ */
function ptrPos(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault(); ac();
  if (state === 'play') { steerOn = true; steerX = ptrPos(e).x; try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
  else if (state === 'over' && time - overAt > 0.7) queueRestart();
});
cv.addEventListener('pointermove', function (e) { if (state === 'play' && steerOn) steerX = ptrPos(e).x; });
cv.addEventListener('pointerup', function () { steerOn = false; });
cv.addEventListener('pointercancel', function () { steerOn = false; });
document.getElementById('startBtn').addEventListener('click', function (e) { e.stopPropagation(); startCountdown(); });
document.getElementById('againBtn').addEventListener('click', function (e) { e.stopPropagation(); queueRestart(); });
document.getElementById('muteBtn').addEventListener('click', function (e) {
  e.stopPropagation(); muted = !muted; this.textContent = muted ? '🔇' : '🔊'; if (!muted) ac();
});
window.addEventListener('keydown', function (e) {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = true;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = true;
  if (e.code === 'Space') { e.preventDefault(); ac(); if (state === 'ready') startCountdown(); else if (state === 'over' && time - overAt > 0.7) queueRestart(); }
});
window.addEventListener('keyup', function (e) {
  if (e.code === 'ArrowLeft' || e.code === 'KeyA') keyL = false;
  if (e.code === 'ArrowRight' || e.code === 'KeyD') keyR = false;
});
document.addEventListener('visibilitychange', function () { lastT = 0; });

resize(); reset();
requestAnimationFrame(loop);
</script>
<div id="handHint" class="hhOn hhSteer">👆</div>

<script>
/* Tutorial hand hint observer (owner, 2026-11-10): passive listeners
   only — the game's own input handlers are untouched. A pointerdown
   anywhere except on a UI button/panel counts as a meaningful input,
   as do Space/arrow keys. The first input of a run hides the hand for
   the rest of that run; hhRunStart() (called from the game's start
   function) opens a new run and re-shows the hand only if the
   previous run had fewer than 3 inputs. */
var hhEl = document.getElementById('handHint');
var hhInputs = 0, hhLive = false;
function hhRunStart(){ var prev = hhInputs; hhInputs = 0; hhLive = true; if (hhEl) hhEl.classList.toggle('hhOn', prev < 3); }
function hhNoteInput(){ if (!hhLive) return; hhInputs++; if (hhEl) hhEl.classList.remove('hhOn'); }
document.addEventListener('pointerdown', function (e) { var t = e.target; if (t && t.closest && t.closest('button, .panel, input, select, a')) return; hhNoteInput(); }, true);
document.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) hhNoteInput(); }, true);
</script>
