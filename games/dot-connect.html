<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dot Connect — Rupiyo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#0b1020; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; max-width:520px; margin:0 auto; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:0; left:0; right:0; padding:12px 14px; z-index:3; pointer-events:none; }
  #hudRow { display:flex; justify-content:space-between; align-items:center; }
  #scoreBox { font-size:30px; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  #timeBox { font-size:16px; font-weight:800; background:rgba(0,0,0,.4); padding:7px 14px; border-radius:999px; }
  #bestBox { font-size:13px; font-weight:700; background:rgba(0,0,0,.4); padding:6px 12px; border-radius:999px; }
  #muteBtn { pointer-events:auto; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.25); color:#fff; width:40px; height:40px; border-radius:50%; font-size:18px; cursor:pointer; }
  #lvlBox { display:inline-block; font-size:14px; font-weight:800; background:rgba(0,0,0,.4); padding:6px 12px; border-radius:999px; margin-top:8px; }
  #ctrlBar { position:absolute; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); z-index:3; display:flex; gap:8px; justify-content:center; }
  .cbtn { flex:1; max-width:118px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.1); color:#fff; font-weight:800; font-size:14px; border-radius:12px; padding:11px 4px; cursor:pointer; }
  .cbtn:active { transform:scale(.95); }
  .cbtn.gold { background:linear-gradient(135deg,#f5c542,#e08b00); color:#231600; border:none; }
  #centerMsg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:4; pointer-events:none; text-align:center; padding:20px; }
  .panel { background:rgba(10,14,26,.95); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:24px 26px; pointer-events:auto; box-shadow:0 18px 50px rgba(0,0,0,.55); max-width:92%; max-height:86%; overflow-y:auto; }
  .panel h1 { font-size:28px; margin-bottom:4px; }
  .panel h1 span { color:#4dabf7; }
  .panel .sub { opacity:.82; font-size:14px; line-height:1.55; margin-bottom:14px; }
  .panel .bigscore { font-size:52px; font-weight:800; color:#f5c542; line-height:1; }
  .panel .bestline { font-size:14px; opacity:.8; margin:6px 0 16px; }
  .btn { display:inline-block; border:none; cursor:pointer; font-weight:800; border-radius:14px; padding:13px 22px; font-size:16px; background:linear-gradient(135deg,#f5c542,#e08b00); color:#231600; box-shadow:0 5px 14px rgba(0,0,0,.35); margin:3px; }
  .btn.blue { background:linear-gradient(135deg,#4dabf7,#1971c2); color:#fff; }
  .btn:active { transform:scale(.96); }
  .lvlGrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:6px 0 14px; }
  .lvlBtn { border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-weight:800; font-size:16px; border-radius:12px; padding:12px 0; cursor:pointer; }
  .lvlBtn.done { background:rgba(81,207,102,.3); border-color:#51cf66; }
  .lvlBtn.locked { opacity:.35; cursor:default; }
  .hidden { display:none !important; }

  /* Tutorial hand hint (owner, 2026-11-10): a looping hand overlay that
     demonstrates this game's primary input — the same help Bag Toss has
     always drawn for its throw. It never blocks input (pointer-events:
     none), shows from the start screen, hides for the rest of a run on
     the player's first meaningful input, and comes back on a new run
     only when the previous run had fewer than 3 inputs (the player is
     still learning). hhRunStart() is called by the game's own start
     function; visibility is the .hhOn class. */
  #handHint { position:fixed; z-index:60; pointer-events:none; display:none; font-size:56px; line-height:1; left:50%; margin-left:-28px; top:62%; filter:drop-shadow(0 3px 6px rgba(0,0,0,.55)); will-change:transform; }
  #handHint.hhOn { display:block; }
  #handHint.hhTap { animation:hhTapK 1.15s ease-in-out infinite; }
  @keyframes hhTapK { 0%,100% { transform:translateY(0) scale(1); } 35% { transform:translateY(10px) scale(.86); } 55% { transform:translateY(10px) scale(.86); } }
  #handHint.hhHold { animation:hhHoldK 1.9s ease-in-out infinite; }
  @keyframes hhHoldK { 0%,100% { transform:translateY(0); } 22% { transform:translateY(12px); } 68% { transform:translateY(12px); } }
  #handHint.hhSteer { animation:hhSteerK 1.7s ease-in-out infinite alternate; }
  @keyframes hhSteerK { from { transform:translateX(-48px); } to { transform:translateX(48px); } }
  #handHint.hhDrag { top:auto; bottom:15%; animation:hhSteerK 1.6s ease-in-out infinite alternate; }
  #handHint.hhTrace { animation:hhTraceK 2.2s linear infinite; }
  @keyframes hhTraceK { 0% { transform:translate(0,0); } 25% { transform:translate(30px,-10px); } 50% { transform:translate(4px,-26px); } 75% { transform:translate(-28px,-10px); } 100% { transform:translate(0,0); } }
  #handHint.hhPull { left:20%; margin-left:0; top:54%; animation:hhPullK 1.8s ease-in-out infinite; }
  @keyframes hhPullK { 0%,100% { transform:translate(0,0); } 45% { transform:translate(-32px,44px); } 60% { transform:translate(-32px,44px); } 74% { transform:translate(6px,-6px); } }
  #handHint.hhConnect { animation:hhConnectK 2s ease-in-out infinite; }
  @keyframes hhConnectK { 0%,100% { transform:translateX(-54px); } 12% { transform:translateX(-54px); } 55% { transform:translateX(54px); } 70% { transform:translateX(54px); } }
  #handHint.hhRight { left:auto; right:11%; margin-left:0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="hudRow">
      <div id="scoreBox">0</div>
      <div id="timeBox">⏱ 60</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div id="bestBox">🏆 0</div>
        <button id="muteBtn" title="Sound on/off">🔊</button>
      </div>
    </div>
    <div id="lvlBox">🧩 Level 1</div>
  </div>
  <div id="ctrlBar">
    <button class="cbtn" id="undoBtn">↩ Undo</button>
    <button class="cbtn" id="resetBtn">🗑 Reset</button>
    <button class="cbtn" id="levelsBtn">☰ Levels</button>
    <button class="cbtn gold" id="finishBtn">✔ Finish</button>
  </div>
  <div id="centerMsg">
    <div class="panel" id="menuPanel">
      <h1>🔵 Dot <span>Connect</span></h1>
      <div class="sub">Drag to draw a pipe between matching dots.<br>Fill <b>every cell</b> — pipes can't cross!<br>🗓 <b>New puzzles every day!</b><br>⏱ 60s per level — 3 fails locks it till tomorrow.<br>Solve fast for a time bonus. <b>10 pts</b> per level.</div>
      <div class="sub" id="menuNote" style="color:#ff8787;font-weight:700;margin-bottom:6px"></div>
      <div class="lvlGrid" id="lvlGrid"></div>
      <button class="btn hidden" id="menuFinishBtn">✔ Finish &amp; Claim</button>
    </div>
    <div class="panel hidden" id="solvedPanel">
      <h1>🎉 Level Done!</h1>
      <div class="bigscore" id="solvedPts">+10</div>
      <div class="bestline" id="solvedNote">Session: 10</div>
      <button class="btn blue" id="nextBtn">▶ Next Level</button>
      <button class="btn" id="solvedFinishBtn">✔ Finish &amp; Claim</button>
    </div>
    <div class="panel hidden" id="overPanel">
      <h1>🏁 Session Done</h1>
      <div class="bigscore" id="finalScore">0</div>
      <div class="bestline" id="finalBest">Best: 0</div>
      <button class="btn" id="againBtn">↻ New Session</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============ Rupiyo score bridge ============ */
var GAME_ID = 'dot-connect';
try { GAME_ID = new URLSearchParams(location.search).get('rp_game') || GAME_ID; } catch (e) {}
var RP_MODE = '';
try { RP_MODE = new URLSearchParams(location.search).get('mode') || ''; } catch (e) {}
var scoreSent = false;
function reportScore(s) {
  if (scoreSent) return; scoreSent = true;
  s = Math.max(0, Math.floor(s));
  try { parent.postMessage({ type: 'rupiyo:score', game: GAME_ID, score: s }, '*'); } catch (e) {}
  try { if (window.RupiyoBridge && window.RupiyoBridge.postScore) window.RupiyoBridge.postScore(s); } catch (e) {}
}
function rpAd(cb){ if(window.parent===window){ cb(); return; } let done=false; const fin=()=>{ if(done) return; done=true; window.removeEventListener('message',h); cb(); }; const h=e=>{ if(e.data && e.data.type==='rupiyo:ad-done') fin(); }; window.addEventListener('message',h); try{ parent.postMessage({type:'rupiyo:ad',kind:'interstitial'},'*'); }catch(_){ } setTimeout(fin,5000); }

/* ============ Audio (all synthesized) ============ */
var AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted) return; var c = ac(); if (!c) return;
  var t0 = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfxStep(n) { tone(340 + Math.min(14, n) * 36, 0.06, 'sine', 0.07); }
function sfxConnect() { tone(660, 0.09, 'triangle', 0.13); tone(990, 0.14, 'triangle', 0.13, null, 0.08); }
function sfxCut() { tone(220, 0.08, 'square', 0.07, 140); }
function sfxWin() { tone(523, 0.11, 'triangle', 0.14); tone(659, 0.11, 'triangle', 0.14, null, 0.1); tone(784, 0.11, 'triangle', 0.14, null, 0.2); tone(1047, 0.26, 'triangle', 0.16, null, 0.3); }
function sfxClick() { tone(500, 0.05, 'sine', 0.08); }
function sfxFail() { tone(320, 0.16, 'sawtooth', 0.1, 210); tone(210, 0.24, 'sawtooth', 0.1, 130, 0.14); }

/* ============ Canvas setup ============ */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

/* ============ Levels (dots only; solutions exist by construction) ============ */
var COLORS = [
  { name: 'Red',    main: '#ff4757', dark: '#c2255c' },
  { name: 'Blue',   main: '#3fa9f5', dark: '#1971c2' },
  { name: 'Green',  main: '#51cf66', dark: '#2b8a3e' },
  { name: 'Yellow', main: '#ffd43b', dark: '#e08b00' },
  { name: 'Purple', main: '#b197fc', dark: '#7048e8' },
  { name: 'Orange', main: '#ffa94d', dark: '#d9480f' },
  { name: 'Pink',   main: '#f06595', dark: '#a61e4d' }
];
/* ============ Level specs — built-in (config can replace the list) ============
   One entry per daily puzzle slot: n = grid size; pairs (optional)
   pins the number of colour pairs — without it the generator draws the
   count from the same n-based range it always used, so the built-in
   specs below reproduce today's puzzles exactly. pjApplyDotLevels()
   (bottom of this script) swaps in config.levels['dot-connect'] when
   every entry validates; anything else keeps these built-ins. */
var BUILTIN_SPEC = [{n:5},{n:5},{n:5},{n:5},{n:6},{n:6},{n:6},{n:6},{n:7},{n:7},{n:7},{n:7}];
var LEVEL_SPEC = BUILTIN_SPEC;

/* ============ Daily puzzle generator (pure — verified offline) ============ */
/* GEN START */
function hashSeed(str) {
  var h = 2166136261;
  for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hamPath(n, rng) {
  // Random Hamiltonian path over the n x n grid in bounded time:
  // start from a boustrophedon snake, then apply random "backbite" flips
  // (each flip provably keeps a valid Hamiltonian path), then a random
  // rotation/reflection of the whole grid for extra variety.
  var N = n * n, path = [], r, c, i;
  for (r = 0; r < n; r++) {
    if (r % 2 === 0) { for (c = 0; c < n; c++) path.push(r * n + c); }
    else { for (c = n - 1; c >= 0; c--) path.push(r * n + c); }
  }
  var pos = new Int32Array(N);
  function rebuildPos() { for (var i2 = 0; i2 < N; i2++) pos[path[i2]] = i2; }
  function neighbours(cell) {
    var rr = Math.floor(cell / n), cc = cell % n, out = [];
    if (rr > 0) out.push(cell - n);
    if (rr < n - 1) out.push(cell + n);
    if (cc > 0) out.push(cell - 1);
    if (cc < n - 1) out.push(cell + 1);
    return out;
  }
  rebuildPos();
  var moves = N * 8;
  for (i = 0; i < moves; i++) {
    if (rng() < 0.5) { path.reverse(); rebuildPos(); }
    var e = path[N - 1], nbs = neighbours(e), opts = [], j, k;
    for (j = 0; j < nbs.length; j++) { k = pos[nbs[j]]; if (k <= N - 3) opts.push(k); }
    if (!opts.length) continue;
    var kk = opts[Math.floor(rng() * opts.length)];
    path = path.slice(0, kk + 1).concat(path.slice(kk + 1).reverse());
    rebuildPos();
  }
  var rots = Math.floor(rng() * 4), swap = rng() < 0.5;
  return path.map(function (cell) {
    var rr = Math.floor(cell / n), cc = cell % n, t;
    if (swap) { t = rr; rr = cc; cc = t; }
    for (var q = 0; q < rots; q++) { t = rr; rr = cc; cc = n - 1 - t; }
    return rr * n + cc;
  });
}
function splitSegs(path, K, rng) {
  // Split the path into K consecutive segments (sizes >= 3 where possible).
  var N = path.length, sizes = [], i;
  var base = Math.floor(N / K), rem = N % K;
  for (i = 0; i < K; i++) sizes.push(base + (i < rem ? 1 : 0));
  for (i = 0; i < K; i++) { var j = Math.floor(rng() * K), t = sizes[i]; sizes[i] = sizes[j]; sizes[j] = t; }
  for (i = 0; i < K * 2; i++) {
    var a = Math.floor(rng() * (K - 1));
    if (sizes[a] > 3 && rng() < 0.7) { sizes[a]--; sizes[a + 1]++; }
    else if (sizes[a + 1] > 3) { sizes[a + 1]--; sizes[a]++; }
  }
  var segs = [], pos = 0;
  for (i = 0; i < K; i++) { segs.push(path.slice(pos, pos + sizes[i])); pos += sizes[i]; }
  return segs;
}
function genLevelData(dayStr, idx) {
  var spec = LEVEL_SPEC[idx] || { n: 7 };
  var n = spec.n;
  var rng = mulberry32(hashSeed(dayStr + '#' + idx));
  var path = hamPath(n, rng), r, c;
  if (!path) { // guaranteed fallback: boustrophedon snake (always a valid Hamiltonian path)
    path = [];
    for (r = 0; r < n; r++) {
      if (r % 2 === 0) { for (c = 0; c < n; c++) path.push(r * n + c); }
      else { for (c = n - 1; c >= 0; c--) path.push(r * n + c); }
    }
  }
  var lo = n === 5 ? 4 : (n === 6 ? 5 : 6), hi = lo + 1;
  var K = (typeof spec.pairs === 'number') ? spec.pairs : lo + Math.floor(rng() * (hi - lo + 1));
  var segs = splitSegs(path, K, rng);
  var pairs = [];
  for (var i = 0; i < segs.length; i++) {
    var a = segs[i][0], b = segs[i][segs[i].length - 1];
    pairs.push([[Math.floor(a / n), a % n], [Math.floor(b / n), b % n]]);
  }
  return { n: n, pairs: pairs, segs: segs };
}
/* GEN END */

/* ============ Daily state (fails / solved reset each day; unlocks persist) ============ */
var TOTAL_LEVELS = 12;
function todayStr() {
  var d = new Date(), p = function (v) { return (v < 10 ? '0' : '') + v; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function loadDaily() {
  var d = null;
  try { d = JSON.parse(localStorage.getItem('rp_dot_daily') || 'null'); } catch (e) {}
  if (!d || typeof d !== 'object') {
    var old = 0;
    try { old = parseInt(localStorage.getItem('rp_dot_unlocked') || '0', 10) || 0; } catch (e) {}
    d = { day: todayStr(), fails: {}, solvedToday: {}, unlocked: old };
  }
  if (typeof d.unlocked !== 'number') d.unlocked = 0;
  if (d.unlocked > TOTAL_LEVELS - 1) d.unlocked = TOTAL_LEVELS - 1;
  if (!d.fails) d.fails = {};
  if (!d.solvedToday) d.solvedToday = {};
  if (typeof d.doneDay !== 'string') d.doneDay = '';
  if (typeof d.doneLevel !== 'number') d.doneLevel = -1;
  return d;
}
var daily = loadDaily();
function saveDaily() { try { localStorage.setItem('rp_dot_daily', JSON.stringify(daily)); } catch (e) {} }
/* DAILY-LOCK — one new level per day: once the frontier level is completed
   today (doneDay/doneLevel), the NEXT level stays locked until tomorrow.
   Everything up to and including today's completed level stays playable in
   every mode — Earn More, and Daily Task quest sessions (mode=quest) — and
   still reports its score, so the daily quest can always be finished. */
function progressCap() {
  if (daily.doneDay === todayStr()) return Math.min(daily.unlocked, Math.max(0, daily.doneLevel));
  return daily.unlocked;
}
function nextLockedToday() { return daily.doneDay === todayStr() && daily.unlocked > progressCap(); }
function refreshDaily() {
  var t = todayStr();
  if (daily.day !== t) {
    daily.day = t; daily.fails = {}; daily.solvedToday = {};
    saveDaily();
    LEVELS = buildDailyLevels();
  }
}
function buildDailyLevels() {
  var out = [];
  for (var i = 0; i < LEVEL_SPEC.length; i++) {
    var d = genLevelData(daily.day, i);
    out.push({ n: d.n, pairs: d.pairs });
  }
  return out;
}
var LEVELS = buildDailyLevels();

/* ============ Game state ============ */
var LEVEL_TIME = 60;
var state = 'menu'; // menu | play | solved | over
var time = 0;
var sessionScore = 0, best = 0;
try { best = parseInt(localStorage.getItem('rp_best_' + GAME_ID) || '0', 10) || 0; } catch (e) {}
var lvl = 0, paths = [], complete = [], awarded = {}, undoStack = [];
var active = -1, levelTime = LEVEL_TIME, solvedPtsLast = 0;
var parts = [], pops = [];

function gridGeom() {
  var n = LEVELS[lvl].n;
  var top = 132, bottom = H - 86;
  var size = Math.min(W - 26, bottom - top);
  var cell = size / n;
  return { n: n, size: size, cell: cell, ox: (W - size) / 2, oy: top + (bottom - top - size) / 2 };
}
function dotMap() {
  var m = {}, pairs = LEVELS[lvl].pairs;
  for (var c = 0; c < pairs.length; c++) for (var e = 0; e < 2; e++) {
    m[pairs[c][e][0] + ',' + pairs[c][e][1]] = { color: c, end: e };
  }
  return m;
}
function pathIndexOf(c, r, col) {
  var P = paths[c];
  for (var i = 0; i < P.length; i++) if (P[i][0] === r && P[i][1] === col) return i;
  return -1;
}
function endpointsConnected(c) {
  var P = paths[c];
  if (!P || P.length < 2) return false;
  var dm = dotMap();
  var a = dm[P[0][0] + ',' + P[0][1]], b = dm[P[P.length - 1][0] + ',' + P[P.length - 1][1]];
  return !!(a && b && a.color === c && b.color === c && a.end !== b.end);
}
function filledCount() { var s = 0; for (var c = 0; c < paths.length; c++) s += paths[c].length; return s; }
function snapshot() {
  undoStack.push(JSON.stringify({ p: paths, c: complete }));
  if (undoStack.length > 60) undoStack.shift();
}
function loadLevel(i) {
  if (typeof hhRunStart === 'function') hhRunStart();   // tutorial hand: a new run begins
  refreshDaily();
  if (i > daily.unlocked) return;
  if (i > progressCap()) { showMenu('🔒 Next level unlocks tomorrow — come back for tomorrow\'s level.'); return; }
  if ((daily.fails[i] || 0) >= 3) { showMenu('🔒 Level ' + (i + 1) + ' is locked for today — back tomorrow, new puzzle!'); return; }
  lvl = i;
  var nPairs = LEVELS[lvl].pairs.length;
  paths = []; complete = []; undoStack = [];
  for (var c = 0; c < nPairs; c++) { paths.push([]); complete.push(false); }
  active = -1; levelTime = LEVEL_TIME;
  state = 'play';
  document.getElementById('menuPanel').classList.add('hidden');
  document.getElementById('solvedPanel').classList.add('hidden');
  document.getElementById('overPanel').classList.add('hidden');
  updateHud();
}
function updateHud() {
  document.getElementById('scoreBox').textContent = sessionScore;
  document.getElementById('bestBox').textContent = '🏆 ' + Math.max(best, sessionScore);
  document.getElementById('timeBox').textContent = '⏱ ' + Math.ceil(Math.max(0, levelTime));
  document.getElementById('timeBox').style.color = levelTime <= 0 ? '#ff8787' : '#fff';
  document.getElementById('lvlBox').textContent = '🧩 Level ' + (lvl + 1) + ' / ' + LEVELS.length + ' · ' + LEVELS[lvl].n + '×' + LEVELS[lvl].n + failPips(lvl);
}
function failPips(i) {
  var f = daily.fails[i] || 0, s = '';
  for (var k = 0; k < f; k++) s += '✖';
  return s ? ' · ' + s : '';
}
function buildMenu() {
  refreshDaily();
  var grid = document.getElementById('lvlGrid');
  grid.innerHTML = '';
  for (var i = 0; i < LEVELS.length; i++) {
    (function (idx) {
      var dayLocked = (daily.fails[idx] || 0) >= 3;
      var seqLocked = idx > progressCap();
      var b = document.createElement('button');
      b.className = 'lvlBtn' + (daily.solvedToday[idx] ? ' done' : '') + ((dayLocked || seqLocked) ? ' locked' : '');
      b.textContent = (dayLocked || seqLocked) ? '🔒' : (idx + 1) + (daily.solvedToday[idx] ? ' ✓' : '') + failPips(idx).replace(' · ', ' ');
      if (!dayLocked && !seqLocked) b.addEventListener('click', function () { sfxClick(); loadLevel(idx); });
      grid.appendChild(b);
    })(i);
  }
  document.getElementById('menuFinishBtn').classList.toggle('hidden', sessionScore <= 0);
  var mn = document.getElementById('menuNote');
  if (nextLockedToday() && !mn.textContent) mn.textContent = '🗓 Today\'s level done — the next level unlocks tomorrow. Replays still earn coins!';
}
function showMenu(note) {
  state = 'menu'; active = -1;
  document.getElementById('menuNote').textContent = note || '';
  buildMenu();
  document.getElementById('menuPanel').classList.remove('hidden');
  document.getElementById('solvedPanel').classList.add('hidden');
  document.getElementById('overPanel').classList.add('hidden');
  updateHud();
}
function burst(x, y, colors, n) {
  for (var i = 0; i < (n || 12); i++) {
    var a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 240;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.5 + Math.random() * 0.35, t: 0, c: colors[i % colors.length], r: 2.5 + Math.random() * 3.5, star: Math.random() < 0.5 });
  }
}
function confetti(x, y) {
  var cols = ['#ffd94d', '#ff6b81', '#51cf66', '#4dabf7', '#b197fc'];
  for (var i = 0; i < 46; i++) {
    var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 250 + Math.random() * 330;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.9 + Math.random() * 0.5, t: 0, c: cols[i % cols.length], r: 3 + Math.random() * 3, star: false, rect: true, rot: Math.random() * 6 });
  }
}
function popup(x, y, txt, color, big) { pops.push({ x: x, y: y, txt: txt, t: 0, c: color || '#ffd94d', big: !!big }); }

/* ============ Drawing the pipes ============ */
function startDraw(r, c) {
  var dm = dotMap(), d = dm[r + ',' + c];
  var col, idx;
  if (d) {
    col = d.color;
    snapshot();
    paths[col] = [[r, c]];
    complete[col] = false;
    active = col;
    sfxStep(1);
    return;
  }
  for (col = 0; col < paths.length; col++) {
    idx = pathIndexOf(col, r, c);
    if (idx >= 0) {
      snapshot();
      paths[col].length = idx + 1;
      complete[col] = endpointsConnected(col);
      active = col;
      sfxStep(1);
      return;
    }
  }
}
function moveDraw(r, c) {
  if (active < 0 || state !== 'play') return;
  var P = paths[active];
  if (!P.length) return;
  var last = P[P.length - 1];
  if (last[0] === r && last[1] === c) return;
  if (Math.abs(last[0] - r) + Math.abs(last[1] - c) !== 1) return; // only step to neighbours
  var dm = dotMap(), d = dm[r + ',' + c];
  var idx = pathIndexOf(active, r, c);
  if (idx >= 0) { // backtrack along own pipe
    snapshot();
    P.length = idx + 1;
    complete[active] = endpointsConnected(active);
    sfxStep(P.length);
    return;
  }
  if (d) {
    if (d.color !== active) return;              // foreign dot blocks
    if (P[0][0] === r && P[0][1] === c) return;  // own start dot (already in path)
    snapshot();                                   // reached the matching dot!
    P.push([r, c]);
    complete[active] = true;
    sfxConnect();
    var g = gridGeom();
    burst(g.ox + (c + 0.5) * g.cell, g.oy + (r + 0.5) * g.cell, [COLORS[active].main, '#ffffff'], 10);
    checkWin();
    return;
  }
  for (var col = 0; col < paths.length; col++) {
    if (col === active) continue;
    var oi = pathIndexOf(col, r, c);
    if (oi >= 0) { // cut the other pipe at this cell and take the cell
      snapshot();
      paths[col].length = oi;
      complete[col] = endpointsConnected(col);
      P.push([r, c]);
      sfxCut();
      checkWin();
      return;
    }
  }
  snapshot();
  P.push([r, c]);
  sfxStep(P.length);
  checkWin();
}
function checkWin() {
  var n = LEVELS[lvl].n;
  for (var c = 0; c < complete.length; c++) if (!complete[c]) return;
  if (filledCount() !== n * n) return;
  solveLevel();
}
function solveLevel() {
  state = 'solved'; active = -1;
  var bonus = levelTime > 0 ? Math.min(5, Math.ceil(levelTime / 12)) : 0;
  solvedPtsLast = 0;
  if (!awarded[lvl]) {
    awarded[lvl] = true;
    solvedPtsLast = 10 + bonus;
    sessionScore += solvedPtsLast;
  }
  daily.solvedToday[lvl] = true;
  var wasFrontier = (lvl === daily.unlocked);
  if (lvl + 1 > daily.unlocked && lvl + 1 < LEVELS.length) daily.unlocked = lvl + 1;
  if (wasFrontier) { daily.doneDay = todayStr(); daily.doneLevel = lvl; }   // DAILY-LOCK: one new level per day
  saveDaily();
  sfxWin();
  var g = gridGeom();
  confetti(g.ox + g.size / 2, g.oy + g.size / 2);
  if (navigator.vibrate) { try { navigator.vibrate(50); } catch (e) {} }
  document.getElementById('solvedPts').textContent = solvedPtsLast > 0 ? '+' + solvedPtsLast : '✓';
  document.getElementById('solvedNote').textContent = (solvedPtsLast > 0 ? 'Level solved! ' : 'Already scored this session. ') + 'Session score: ' + sessionScore;
  if (wasFrontier && nextLockedToday()) document.getElementById('solvedNote').textContent += ' 🗓 Next level unlocks tomorrow.';
  document.getElementById('nextBtn').style.display = (lvl + 1 < LEVELS.length && lvl + 1 <= progressCap()) ? '' : 'none';
  document.getElementById('solvedPanel').classList.remove('hidden');
  updateHud();
  if (lvl === LEVELS.length - 1) setTimeout(function () { if (state === 'solved') finishSession(); }, 1600);
}
function finishSession() {
  state = 'over'; active = -1;
  if (sessionScore > best) { best = sessionScore; try { localStorage.setItem('rp_best_' + GAME_ID, String(best)); } catch (e) {} }
  reportScore(sessionScore);
  document.getElementById('finalScore').textContent = sessionScore;
  document.getElementById('finalBest').textContent = 'Best session: ' + best;
  document.getElementById('menuPanel').classList.add('hidden');
  document.getElementById('solvedPanel').classList.add('hidden');
  document.getElementById('overPanel').classList.remove('hidden');
  updateHud();
}

/* ============ Update ============ */
function update(dt) {
  time += dt;
  var i, p;
  for (i = parts.length - 1; i >= 0; i--) { p = parts[i]; p.t += dt; p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot !== undefined) p.rot += dt * 7; if (p.t > p.life) parts.splice(i, 1); }
  for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; pops[i].y -= 50 * dt; if (pops[i].t > 1.0) pops.splice(i, 1); }
  if (state === 'play') {
    levelTime -= dt;
    if (levelTime <= 0) { levelTime = 0; timeUp(); }
    updateHud();
  }
}
function timeUp() {
  active = -1;
  var f = (daily.fails[lvl] || 0) + 1;
  daily.fails[lvl] = f;
  saveDaily();
  sfxFail();
  if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
  if (f >= 3) {
    showMenu('🔒 Level ' + (lvl + 1) + ' locked — 3 fails today. Back tomorrow for a new puzzle!');
  } else {
    popup(W / 2, H * 0.4, '⏱ Time up! Fail ' + f + '/3', '#ff8787', true);
    loadLevel(lvl);
  }
  updateHud();
}

/* ============ Draw ============ */
function drawStar(x, y, r, rot) {
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var a = rot + i * Math.PI / 4, rad = i % 2 === 0 ? r : r * 0.45;
    var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}
function rr(x, y, w, h, rad) {
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b1020'); bg.addColorStop(1, '#131b36');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // faint background dots
  ctx.fillStyle = 'rgba(120,150,255,.10)';
  for (var i = 0; i < 26; i++) {
    ctx.beginPath(); ctx.arc((i * 97.3) % (W + 10) - 5, (i * 61.7) % (H + 10) - 5, 2, 0, 7); ctx.fill();
  }
  var g = gridGeom(), n = g.n;
  // board
  ctx.fillStyle = '#171f3d';
  rr(g.ox - 9, g.oy - 9, g.size + 18, g.size + 18, 18); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 1.5; ctx.stroke();
  // cells
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
    ctx.fillStyle = (r + c) % 2 === 0 ? 'rgba(255,255,255,.055)' : 'rgba(255,255,255,.028)';
    rr(g.ox + c * g.cell + 1.5, g.oy + r * g.cell + 1.5, g.cell - 3, g.cell - 3, 7); ctx.fill();
  }
  // pipes
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (var col = 0; col < paths.length; col++) {
    var P = paths[col];
    if (P.length < 2) continue;
    ctx.strokeStyle = COLORS[col].main;
    ctx.globalAlpha = complete[col] ? 0.95 : 0.75;
    ctx.lineWidth = g.cell * (col === active ? 0.56 : 0.48);
    if (complete[col]) { ctx.shadowColor = COLORS[col].main; ctx.shadowBlur = 14; }
    ctx.beginPath();
    for (i = 0; i < P.length; i++) {
      var px = g.ox + (P[i][1] + 0.5) * g.cell, py = g.oy + (P[i][0] + 0.5) * g.cell;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  // dots
  var pairs = LEVELS[lvl].pairs;
  for (col = 0; col < pairs.length; col++) {
    for (var e = 0; e < 2; e++) {
      var cell = pairs[col][e];
      var cx = g.ox + (cell[1] + 0.5) * g.cell, cy = g.oy + (cell[0] + 0.5) * g.cell;
      var rad = g.cell * 0.31;
      var isActiveEnd = active === col && paths[col].length && paths[col][paths[col].length - 1][0] === cell[0] && paths[col][paths[col].length - 1][1] === cell[1];
      if (isActiveEnd) { rad *= 1 + Math.sin(time * 8) * 0.08; }
      var grd = ctx.createRadialGradient(cx - rad * 0.35, cy - rad * 0.35, rad * 0.15, cx, cy, rad);
      grd.addColorStop(0, '#ffffff'); grd.addColorStop(0.25, COLORS[col].main); grd.addColorStop(1, COLORS[col].dark);
      ctx.fillStyle = grd;
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, 7); ctx.fill();
      ctx.strokeStyle = complete[col] ? '#ffffff' : 'rgba(255,255,255,.65)';
      ctx.lineWidth = complete[col] ? 3 : 2; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(cx - rad * 0.3, cy - rad * 0.32, rad * 0.18, 0, 7); ctx.fill();
    }
  }
  // particles
  for (i = 0; i < parts.length; i++) {
    var q = parts[i];
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c;
    if (q.rect) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot || 0); ctx.fillRect(-q.r, -q.r * 0.6, q.r * 2, q.r * 1.2); ctx.restore(); }
    else if (q.star) drawStar(q.x, q.y, q.r * 2, q.t * 6);
    else { ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < pops.length; i++) {
    var pp = pops[i];
    ctx.globalAlpha = 1 - pp.t / 1.0;
    ctx.font = '800 ' + (pp.big ? 27 : 20) + 'px system-ui, sans-serif';
    ctx.fillStyle = pp.c; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 4;
    ctx.strokeText(pp.txt, pp.x, pp.y); ctx.fillText(pp.txt, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
}

/* ============ Loop ============ */
var lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000; lastT = ts;
  if (dt > 0.05) dt = 0.05;
  if (!document.hidden) { update(dt); draw(); }
}

/* ============ Input ============ */
function cellFromEvent(e) {
  var rect = cv.getBoundingClientRect();
  var x = e.clientX - rect.left, y = e.clientY - rect.top;
  var g = gridGeom();
  var c = Math.floor((x - g.ox) / g.cell), r = Math.floor((y - g.oy) / g.cell);
  if (r < 0 || c < 0 || r >= g.n || c >= g.n) return null;
  return [r, c];
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault(); ac();
  if (state !== 'play') return;
  var cell = cellFromEvent(e);
  if (cell) { startDraw(cell[0], cell[1]); try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
});
cv.addEventListener('pointermove', function (e) {
  if (state !== 'play' || active < 0) return;
  var cell = cellFromEvent(e);
  if (cell) moveDraw(cell[0], cell[1]);
});
function endPointer() { active = -1; }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
document.getElementById('undoBtn').addEventListener('click', function () {
  if (state !== 'play' || !undoStack.length) return;
  var s = JSON.parse(undoStack.pop());
  paths = s.p; complete = s.c; active = -1; sfxClick();
});
document.getElementById('resetBtn').addEventListener('click', function () {
  if (state !== 'play') return;
  snapshot();
  for (var c = 0; c < paths.length; c++) { paths[c] = []; complete[c] = false; }
  active = -1; sfxClick();
});
document.getElementById('levelsBtn').addEventListener('click', function () { if (state === 'play' || state === 'solved') { sfxClick(); showMenu(); } });
document.getElementById('finishBtn').addEventListener('click', function () { if (state === 'play' || state === 'menu') { sfxClick(); finishSession(); } });
document.getElementById('menuFinishBtn').addEventListener('click', function () { finishSession(); });
document.getElementById('solvedFinishBtn').addEventListener('click', function () { finishSession(); });
document.getElementById('nextBtn').addEventListener('click', function () { if (lvl + 1 < LEVELS.length) { sfxClick(); rpAd(function () { loadLevel(lvl + 1); }); } });
document.getElementById('againBtn').addEventListener('click', function () {
  sfxClick();
  rpAd(function () { sessionScore = 0; awarded = {}; scoreSent = false; showMenu(); });
});
document.getElementById('muteBtn').addEventListener('click', function (e) {
  e.stopPropagation(); muted = !muted; this.textContent = muted ? '🔇' : '🔊'; if (!muted) ac();
});
document.addEventListener('visibilitychange', function () { lastT = 0; });

resize();
paths = []; complete = [];
for (var ci = 0; ci < LEVELS[0].pairs.length; ci++) { paths.push([]); complete.push(false); }
buildMenu(); updateHud();
requestAnimationFrame(loop);

/* ============ Config-driven levels (owner, 2026-11-10) ============
   The live config may carry levels['dot-connect'] — level specs in
   this game's own format ({n, pairs?} per daily slot). When present
   and EVERY entry validates, the list replaces the built-in spec and
   the daily puzzles are regenerated from it; anything else (offline,
   missing key, one bad entry) silently keeps the built-ins, so a bad
   config can never break the game. Applied only from the menu — a
   level in progress is never swapped under the player. */
var PJ_CFG_URL = 'https://paisajeeto.github.io/paisajeeto/config.json';
window.__pjLevelsSource = 'builtin';
function pjValidDotLevels(a) {
  if (!Array.isArray(a) || !a.length) return false;
  for (var i = 0; i < a.length; i++) {
    var e = a[i];
    if (!e || typeof e !== 'object' || Array.isArray(e)) return false;
    if (!Number.isInteger(e.n) || e.n < 4 || e.n > 8) return false;
    if (e.pairs !== undefined && (!Number.isInteger(e.pairs) || e.pairs < 3 || e.pairs > Math.floor(e.n * e.n / 3))) return false;
  }
  return true;
}
function pjApplyDotLevels(a) {
  if (state !== 'menu') return false;
  LEVEL_SPEC = a;
  TOTAL_LEVELS = a.length;
  if (daily.unlocked > TOTAL_LEVELS - 1) { daily.unlocked = TOTAL_LEVELS - 1; saveDaily(); }
  LEVELS = buildDailyLevels();
  window.__pjLevelsSource = 'config';
  buildMenu(); updateHud();
  return true;
}
(function pjLoadLevels() {
  if (typeof fetch !== 'function') return;
  var ctl = null;
  try {
    if ('AbortController' in window) {
      ctl = new AbortController();
      setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 2500);
    }
  } catch (e) {}
  fetch(PJ_CFG_URL, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      try { if (cfg && cfg.levels && pjValidDotLevels(cfg.levels['dot-connect'])) pjApplyDotLevels(cfg.levels['dot-connect']); } catch (e) {}
    })
    .catch(function () {});
})();
</script>
<div id="handHint" class="hhOn hhConnect">👆</div>

<script>
/* Tutorial hand hint observer (owner, 2026-11-10): passive listeners
   only — the game's own input handlers are untouched. A pointerdown
   anywhere except on a UI button/panel counts as a meaningful input,
   as do Space/arrow keys. The first input of a run hides the hand for
   the rest of that run; hhRunStart() (called from the game's start
   function) opens a new run and re-shows the hand only if the
   previous run had fewer than 3 inputs. */
var hhEl = document.getElementById('handHint');
var hhInputs = 0, hhLive = false;
function hhRunStart(){ var prev = hhInputs; hhInputs = 0; hhLive = true; if (hhEl) hhEl.classList.toggle('hhOn', prev < 3); }
function hhNoteInput(){ if (!hhLive) return; hhInputs++; if (hhEl) hhEl.classList.remove('hhOn'); }
document.addEventListener('pointerdown', function (e) { var t = e.target; if (t && t.closest && t.closest('button, .panel, input, select, a')) return; hhNoteInput(); }, true);
document.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) hhNoteInput(); }, true);
</script>
