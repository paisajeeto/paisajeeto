<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hero Jump — Rupiyo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#0b1030; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; max-width:520px; margin:0 auto; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:flex-start; padding:12px 14px; pointer-events:none; z-index:3; }
  #scoreBox { font-size:40px; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.4); }
  #bestBox { font-size:13px; font-weight:700; background:rgba(0,0,0,.35); padding:6px 12px; border-radius:999px; }
  #muteBtn { pointer-events:auto; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.25); color:#fff; width:42px; height:42px; border-radius:50%; font-size:19px; cursor:pointer; }
  #chips { position:absolute; top:64px; left:0; right:0; display:flex; justify-content:center; gap:8px; z-index:3; pointer-events:none; }
  .chip { font-size:15px; font-weight:800; background:rgba(0,0,0,.4); padding:6px 14px; border-radius:999px; border:1px solid rgba(255,255,255,.18); }
  #centerMsg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:4; pointer-events:none; text-align:center; padding:20px; }
  #countNum { font-size:110px; font-weight:800; color:#f5c542; text-shadow:0 5px 0 #b97e00, 0 10px 30px rgba(0,0,0,.5); display:none; }
  .panel { background:rgba(13,16,22,.93); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:26px 30px; pointer-events:auto; box-shadow:0 18px 50px rgba(0,0,0,.55); max-width:88%; }
  .panel h1 { font-size:29px; margin-bottom:4px; }
  .panel h1 span { color:#2ee6c8; }
  .panel .sub { opacity:.78; font-size:14px; line-height:1.55; margin-bottom:14px; }
  .panel .bigscore { font-size:52px; font-weight:800; color:#f5c542; line-height:1; }
  .panel .bestline { font-size:14px; opacity:.8; margin:6px 0 16px; }
  .btn { display:inline-block; border:none; cursor:pointer; font-weight:800; border-radius:14px; padding:14px 26px; font-size:17px; background:linear-gradient(135deg,#2ee6c8,#0e9bb5); color:#04222b; box-shadow:0 5px 14px rgba(0,0,0,.35); }
  .btn:active { transform:scale(.96); }
  .hidden { display:none !important; }

  /* Tutorial hand hint (owner, 2026-11-10): a looping hand overlay that
     demonstrates this game's primary input — the same help Bag Toss has
     always drawn for its throw. It never blocks input (pointer-events:
     none), shows from the start screen, hides for the rest of a run on
     the player's first meaningful input, and comes back on a new run
     only when the previous run had fewer than 3 inputs (the player is
     still learning). hhRunStart() is called by the game's own start
     function; visibility is the .hhOn class. */
  #handHint { position:fixed; z-index:60; pointer-events:none; display:none; font-size:56px; line-height:1; left:50%; margin-left:-28px; top:62%; filter:drop-shadow(0 3px 6px rgba(0,0,0,.55)); will-change:transform; }
  #handHint.hhOn { display:block; }
  #handHint.hhTap { animation:hhTapK 1.15s ease-in-out infinite; }
  @keyframes hhTapK { 0%,100% { transform:translateY(0) scale(1); } 35% { transform:translateY(10px) scale(.86); } 55% { transform:translateY(10px) scale(.86); } }
  #handHint.hhHold { animation:hhHoldK 1.9s ease-in-out infinite; }
  @keyframes hhHoldK { 0%,100% { transform:translateY(0); } 22% { transform:translateY(12px); } 68% { transform:translateY(12px); } }
  #handHint.hhSteer { animation:hhSteerK 1.7s ease-in-out infinite alternate; }
  @keyframes hhSteerK { from { transform:translateX(-48px); } to { transform:translateX(48px); } }
  #handHint.hhDrag { top:auto; bottom:15%; animation:hhSteerK 1.6s ease-in-out infinite alternate; }
  #handHint.hhTrace { animation:hhTraceK 2.2s linear infinite; }
  @keyframes hhTraceK { 0% { transform:translate(0,0); } 25% { transform:translate(30px,-10px); } 50% { transform:translate(4px,-26px); } 75% { transform:translate(-28px,-10px); } 100% { transform:translate(0,0); } }
  #handHint.hhPull { left:20%; margin-left:0; top:54%; animation:hhPullK 1.8s ease-in-out infinite; }
  @keyframes hhPullK { 0%,100% { transform:translate(0,0); } 45% { transform:translate(-32px,44px); } 60% { transform:translate(-32px,44px); } 74% { transform:translate(6px,-6px); } }
  #handHint.hhConnect { animation:hhConnectK 2s ease-in-out infinite; }
  @keyframes hhConnectK { 0%,100% { transform:translateX(-54px); } 12% { transform:translateX(-54px); } 55% { transform:translateX(54px); } 70% { transform:translateX(54px); } }
  #handHint.hhRight { left:auto; right:11%; margin-left:0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="scoreBox">0</div>
    <div style="display:flex;gap:8px;align-items:center">
      <div id="bestBox">🏆 0</div>
      <button id="muteBtn" title="Sound on/off">🔊</button>
    </div>
  </div>
  <div id="chips">
    <div class="chip" id="distBox">🏃 0 m</div>
    <div class="chip" id="coinBox">🪙 ×0</div>
    <div class="chip">Tap = jump · Hold = higher!</div>
  </div>
  <div id="centerMsg">
    <div id="countNum">3</div>
    <div class="panel" id="startPanel">
      <h1>🦸 Hero <span>Jump</span></h1>
      <div class="sub">Sprint across the night rooftops!<br><b>Tap</b> to jump — <b>hold</b> to jump higher &amp; further.<br>Grab the coins over the gaps. Miss a roof… and you fall!<br>⚠️ Dodge the rooftop clutter &amp; pigeons — one hit and it's over!</div>
      <button class="btn" id="startBtn">▶ Run</button>
    </div>
    <div class="panel hidden" id="overPanel">
      <h1 id="overTitle">💥 You Fell!</h1>
      <div class="bigscore" id="finalScore">0</div>
      <div class="bestline" id="finalLine">0 m · 🪙 0</div>
      <div class="bestline" id="finalBest">Best: 0</div>
      <button class="btn" id="againBtn">↻ Run Again</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============ Rupiyo score bridge ============ */
var GAME_ID = 'hero-jump';
try { GAME_ID = new URLSearchParams(location.search).get('rp_game') || GAME_ID; } catch (e) {}
var scoreSent = false;
function reportScore(s) {
  if (scoreSent) return; scoreSent = true;
  s = Math.max(0, Math.floor(s));
  try { parent.postMessage({ type: 'rupiyo:score', game: GAME_ID, score: s }, '*'); } catch (e) {}
  try { if (window.RupiyoBridge && window.RupiyoBridge.postScore) window.RupiyoBridge.postScore(s); } catch (e) {}
}

/* ============ Interstitial ad helper ============ */
function rpAd(cb){ if(window.parent===window){ cb(); return; } var done=false; var fin=function(){ if(done) return; done=true; window.removeEventListener('message',h); cb(); }; var h=function(e){ if(e.data && e.data.type==='rupiyo:ad-done') fin(); }; window.addEventListener('message',h); try{ parent.postMessage({type:'rupiyo:ad',kind:'interstitial'},'*'); }catch(_){ } setTimeout(fin,5000); }
var restartQueued = false;
function queueRestart() {
  if (restartQueued) return; restartQueued = true;
  rpAd(function () { restartQueued = false; startCountdown(); });
}

/* ============ Audio (all synthesized) ============ */
var AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted) return; var c = ac(); if (!c) return;
  var t0 = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol, freq, q) {
  if (muted) return; var c = ac(); if (!c) return;
  var n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 800; f.Q.value = q || 0.8;
  var g = c.createGain(); g.gain.value = vol || 0.2;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
}
function sfxJump() { noiseBurst(0.14, 0.10, 1100, 1); tone(320, 0.2, 'sine', 0.11, 700); }
function sfxCoin() { tone(950, 0.07, 'square', 0.10); tone(1420, 0.14, 'square', 0.10, null, 0.06); }
function sfxLand() { noiseBurst(0.08, 0.12, 260, 0.7); }
function sfxFall() { tone(620, 0.7, 'sine', 0.15, 55); noiseBurst(0.5, 0.08, 420, 0.6); }
function sfxCount(final) { tone(final ? 880 : 440, final ? 0.22 : 0.12, 'sine', 0.14); }
function sfxEnd() { tone(392, 0.16, 'triangle', 0.14); tone(330, 0.16, 'triangle', 0.14, null, 0.15); tone(262, 0.34, 'triangle', 0.15, null, 0.3); }

/* ============ Canvas setup ============ */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

/* ============ Game state ============ */
var GRAV = 2600, GRAV_HOLD = 1020, JUMP_V = 1060, PX_PER_M = 46;
var state = 'ready'; // ready | count | play | over
var countT = 0, lastCount = 4;
var score = 0, best = 0, coins = 0, dist = 0;
try { best = parseInt(localStorage.getItem('rp_best_' + GAME_ID) || '0', 10) || 0; } catch (e) {}
var time = 0, elapsed = 0, shake = 0;
var camX = 0, speed = 235;
var buildings = [], coinList = [], parts = [], pops = [], birds = [];
var bIdx = 0, nextBirdAt = 130;
var hero = { y: 0, vy: 0, grounded: false, hold: false, squash: 0, phase: 0 };

function heroSX() { return W * 0.30; }
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function hash(n) { var x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

var HOBS_DIMS = { ac: [44, 30], tank: [52, 46], antenna: [20, 56] };
function makeObs(nw) {
  var list = [];
  if (nw < 300) return list; // roof too short to land + jump again around clutter
  var types = ['ac', 'tank', 'antenna'];
  var t1 = types[Math.floor(Math.random() * 3)], d1 = HOBS_DIMS[t1];
  var room = nw - 200 - d1[0]; // 90 px landing margin at the left edge, 110 px takeoff margin at the right
  var dx1 = 90 + d1[0] / 2 + Math.random() * Math.max(0, room) * (nw >= 470 ? 0.45 : 1);
  list.push({ dx: dx1, type: t1, w: d1[0], h: d1[1] });
  if (nw >= 470 && Math.random() < 0.7) {
    var t2 = types[Math.floor(Math.random() * 3)], d2 = HOBS_DIMS[t2];
    var lo = dx1 + d1[0] / 2 + 180 + d2[0] / 2, hi = nw - 110 - d2[0] / 2;
    if (hi > lo) list.push({ dx: lo + Math.random() * (hi - lo), type: t2, w: d2[0], h: d2[1] });
  }
  return list;
}
function genBuildings() {
  var last = buildings[buildings.length - 1];
  while (last.x + last.w < camX + W + 520) {
    var gapBase = 58 + Math.min(105, dist * 0.5);
    var gap = gapBase + Math.random() * 46;
    gap = Math.min(gap, speed * 0.56); // always clearable with a held jump
    var nx = last.x + last.w + gap;
    var nw = 260 + Math.random() * 260;
    var nTopF = clamp(last.topF + (Math.random() - 0.5) * 0.17, 0.44, 0.80);
    // coins arc over the gap
    var n = gap > 118 ? 4 : 3, minTopF = Math.min(last.topF, nTopF);
    for (var i = 0; i < n; i++) {
      var t = (i + 0.5) / n;
      coinList.push({ x: last.x + last.w + gap * t, topF: minTopF, yOff: 44 + Math.sin(Math.PI * t) * 76, taken: false, ph: Math.random() * 6 });
    }
    buildings.push({ x: nx, w: nw, topF: nTopF, idx: bIdx++, obs: makeObs(nw) });
    last = buildings[buildings.length - 1];
  }
}
function groundAt(wx) {
  for (var i = 0; i < buildings.length; i++) {
    var b = buildings[i];
    if (wx >= b.x && wx <= b.x + b.w) return b.topF * H;
  }
  return Infinity;
}
function curScore() { return Math.floor(dist) + coins * 2; }

function reset() {
  camX = 0; speed = 235; dist = 0; coins = 0; score = 0; elapsed = 0; shake = 0;
  buildings = [{ x: -140, w: 0, topF: 0.68, idx: bIdx++ }];
  buildings[0].w = W + 380;
  coinList = []; parts = []; pops = []; birds = []; nextBirdAt = 130;
  hero.y = 0.68 * H; hero.vy = 0; hero.grounded = true; hero.hold = false; hero.squash = 0; hero.phase = 0;
  scoreSent = false;
  genBuildings();
  updateHud();
}
function updateHud() {
  score = curScore();
  document.getElementById('scoreBox').textContent = score;
  document.getElementById('bestBox').textContent = '🏆 ' + Math.max(best, score);
  document.getElementById('distBox').textContent = '🏃 ' + Math.floor(dist) + ' m';
  document.getElementById('coinBox').textContent = '🪙 ×' + coins;
}
function burst(x, y, colors, n, spd) {
  for (var i = 0; i < (n || 10); i++) {
    var a = Math.random() * Math.PI * 2, v = (spd || 200) * (0.35 + Math.random() * 0.75);
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.4 + Math.random() * 0.3, t: 0, c: colors[i % colors.length], r: 2 + Math.random() * 3.2 });
  }
}
function popup(x, y, txt, color, big) { pops.push({ x: x, y: y, txt: txt, t: 0, c: color || '#ffd94d', big: !!big }); }

function startCountdown() {
  if (typeof hhRunStart === 'function') hhRunStart();   // tutorial hand: a new run begins
  reset();
  state = 'count'; countT = 0; lastCount = 4;
  document.getElementById('startPanel').classList.add('hidden');
  document.getElementById('overPanel').classList.add('hidden');
  document.getElementById('countNum').style.display = 'block';
  ac();
}
function gameOver(kind) {
  if (state === 'over') return;
  state = 'over';
  if (kind === 'fall' || !kind) sfxFall(); else noiseBurst(0.2, 0.18, 480, 0.7);
  sfxEnd();
  shake = 13;
  if (navigator.vibrate) { try { navigator.vibrate(140); } catch (e) {} }
  score = curScore();
  if (score > best) { best = score; try { localStorage.setItem('rp_best_' + GAME_ID, String(best)); } catch (e) {} }
  reportScore(score);
  document.getElementById('overTitle').textContent = kind === 'bird' ? '🐦 Knocked Down!' : (kind === 'crash' ? '💥 Tripped!' : '💥 You Fell!');
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalLine').textContent = '🏃 ' + Math.floor(dist) + ' m · 🪙 ' + coins + ' (coins ×2)';
  document.getElementById('finalBest').textContent = 'Best: ' + best;
  document.getElementById('overPanel').classList.remove('hidden');
  updateHud();
}
function doJump() {
  if (state !== 'play' || !hero.grounded) return;
  hero.vy = -JUMP_V; hero.grounded = false; hero.hold = true;
  hero.squash = -0.16;
  burst(heroSX(), hero.y, ['#9be7ff', '#ffffff', '#2ee6c8'], 7, 130);
  sfxJump();
}

/* ============ Update ============ */
function update(dt) {
  time += dt;
  var i, p;
  for (i = parts.length - 1; i >= 0; i--) { p = parts[i]; p.t += dt; p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) parts.splice(i, 1); }
  for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; pops[i].y -= 52 * dt; if (pops[i].t > 0.95) pops.splice(i, 1); }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (hero.squash > 0) hero.squash = Math.max(0, hero.squash - dt * 1.4);
  if (hero.squash < 0) hero.squash = Math.min(0, hero.squash + dt * 1.1);

  if (state === 'count') {
    countT += dt;
    var n = 3 - Math.floor(countT);
    if (n !== lastCount && n >= 1) { lastCount = n; sfxCount(false); var el = document.getElementById('countNum'); el.textContent = n; el.style.transform = 'scale(1.25)'; setTimeout(function () { el.style.transform = 'scale(1)'; }, 90); }
    if (countT >= 3) { state = 'play'; document.getElementById('countNum').style.display = 'none'; sfxCount(true); }
    return;
  }
  if (state !== 'play') return;

  elapsed += dt;
  dist = camX / PX_PER_M;
  speed = 235 * (1 + Math.min(1, dist / 600)); // dino-style: rises continuously with distance, caps at 2x (~470)
  camX += speed * dt;
  dist = camX / PX_PER_M;
  hero.phase += dt * (hero.grounded ? speed * 0.052 : 2.2);

  var hwx = camX + heroSX();
  var prevY = hero.y;
  hero.vy += ((hero.hold && hero.vy < 0) ? GRAV_HOLD : GRAV) * dt;
  hero.y += hero.vy * dt;
  var g = groundAt(hwx);
  if (hero.vy >= 0 && g !== Infinity && prevY <= g + 2 && hero.y >= g) {
    if (!hero.grounded && hero.vy > 430) {
      sfxLand(); hero.squash = 0.24;
      burst(heroSX() - 8, g, ['#cbb8ff', '#8f83c9'], 6, 110);
    }
    hero.y = g; hero.vy = 0; hero.grounded = true;
  } else if (g === Infinity || hero.y < g - 2) {
    hero.grounded = false;
  }

  // coins
  for (i = coinList.length - 1; i >= 0; i--) {
    var c = coinList[i];
    if (c.x < camX - 90) { coinList.splice(i, 1); continue; }
    if (!c.taken) {
      var sx = c.x - camX, cy = c.topF * H - c.yOff;
      var dx = sx - heroSX(), dy = cy - (hero.y - 34);
      if (dx * dx + dy * dy < 36 * 36) {
        c.taken = true; coins++;
        burst(sx, cy, ['#ffd94d', '#fff3b0', '#ffb03a'], 9, 170);
        popup(sx, cy - 24, '+1 🪙', '#ffd94d');
        sfxCoin();
        coinList.splice(i, 1);
      }
    }
  }
  // pigeons: spawn by distance, drift left in the world frame (approach speed = world speed + 130)
  if (dist >= nextBirdAt) {
    birds.push({ wx: camX + W + 90, y: clamp(hero.y - 80, 80, H * 0.82), ph: Math.random() * 6 });
    nextBirdAt = dist + 240 + Math.random() * 260;
  }
  for (i = birds.length - 1; i >= 0; i--) {
    birds[i].wx -= 130 * dt;
    if (birds[i].wx - camX < -70) birds.splice(i, 1);
  }
  // rooftop obstacles: one hit = run over
  for (i = 0; i < buildings.length; i++) {
    var bb = buildings[i];
    if (!bb.obs || bb.x + bb.w < hwx - 40 || bb.x > hwx + 40) continue;
    for (var oi = 0; oi < bb.obs.length; oi++) {
      var oo = bb.obs[oi];
      var ox0 = bb.x + oo.dx - oo.w / 2, ox1 = bb.x + oo.dx + oo.w / 2;
      if (hwx + 15 > ox0 && hwx - 15 < ox1 && hero.y > bb.topF * H - oo.h + 4) {
        burst(heroSX(), hero.y - 30, ['#ffd94d', '#ff5b3c', '#cbb8ff'], 16, 240);
        gameOver('crash'); return;
      }
    }
  }
  // birds at head height: touching one knocks you down
  for (i = 0; i < birds.length; i++) {
    var bd = birds[i], bsx = bd.wx - camX;
    if (Math.abs(bsx - heroSX()) < 35 && bd.y - 11 < hero.y && bd.y + 11 > hero.y - 86) {
      burst(heroSX() + 6, bd.y, ['#e8ecf4', '#b8c0cc', '#ffffff'], 14, 200);
      popup(heroSX(), hero.y - 110, '🐦💥', '#ffffff', true);
      gameOver('bird'); return;
    }
  }
  // cleanup + extend world
  while (buildings.length && buildings[0].x + buildings[0].w < camX - 200) buildings.shift();
  genBuildings();

  if (hero.y > H + 90) { gameOver(); return; }
  updateHud();
}

/* ============ Draw ============ */
function drawSkyline(off, baseY, hMin, hMax, color, winAlpha) {
  var slot = 74;
  var start = Math.floor(off / slot);
  ctx.fillStyle = color;
  for (var i = -1; i < W / slot + 2; i++) {
    var idx = start + i;
    var bw = slot * (0.62 + hash(idx * 3.7) * 0.34);
    var bh = hMin + hash(idx * 9.1) * (hMax - hMin);
    var x = idx * slot - off;
    ctx.fillRect(x, baseY - bh, bw, bh + 4);
    if (winAlpha > 0) {
      for (var r = 0; r < 4; r++) for (var cix = 0; cix < 2; cix++) {
        if (hash(idx * 51 + r * 7 + cix * 13) < 0.34) {
          ctx.fillStyle = 'rgba(255,214,130,' + winAlpha + ')';
          ctx.fillRect(x + 7 + cix * (bw * 0.42), baseY - bh + 9 + r * (bh / 4.4), 5, 7);
          ctx.fillStyle = color;
        }
      }
    }
  }
}
function drawBuilding(b) {
  var sx = b.x - camX, top = b.topF * H;
  var grd = ctx.createLinearGradient(0, top, 0, H);
  grd.addColorStop(0, '#2b2456'); grd.addColorStop(1, '#151130');
  ctx.fillStyle = grd;
  ctx.fillRect(sx, top, b.w, H - top + 30);
  // roof slab + glow edge
  ctx.fillStyle = '#3d3577'; ctx.fillRect(sx - 3, top - 7, b.w + 6, 9);
  ctx.fillStyle = '#2ee6c8'; ctx.fillRect(sx - 3, top - 2, b.w + 6, 2.5);
  // windows
  var cols = Math.max(1, Math.floor(b.w / 30)), rows = Math.max(1, Math.floor((H - top) / 36));
  for (var r = 0; r < rows; r++) for (var c = 0; c < cols; c++) {
    var lit = hash(b.idx * 131 + r * 17 + c * 29) < 0.42;
    ctx.fillStyle = lit ? 'rgba(255,217,138,.88)' : 'rgba(10,8,26,.85)';
    ctx.fillRect(sx + 10 + c * 30, top + 16 + r * 36, 11, 15);
  }
  // antenna on some roofs
  if (hash(b.idx * 7.3) < 0.45) {
    var ax = sx + b.w * (0.25 + hash(b.idx * 3.1) * 0.5);
    ctx.strokeStyle = '#4a4390'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(ax, top - 7); ctx.lineTo(ax, top - 34); ctx.stroke();
    ctx.fillStyle = (Math.sin(time * 4 + b.idx) > 0) ? '#ff5d5d' : '#7a2430';
    ctx.beginPath(); ctx.arc(ax, top - 37, 3.4, 0, Math.PI * 2); ctx.fill();
  }
}
function drawCoinShape(x, y, r, ph) {
  var sq = Math.abs(Math.cos(time * 4 + ph));
  ctx.save(); ctx.translate(x, y); ctx.scale(0.35 + 0.65 * sq, 1);
  var g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.2, 0, 0, r);
  g.addColorStop(0, '#fff3b0'); g.addColorStop(0.6, '#f5c542'); g.addColorStop(1, '#d9930d');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b97e00'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#b97e00';
  ctx.font = '800 ' + (r * 1.05) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('₹', 0, 1);
  ctx.restore();
}
function drawHero() {
  var u = clamp(W / 360, 0.85, 1.3);
  var cx = heroSX(), feet = hero.y;
  ctx.save();
  ctx.translate(cx, feet);
  var tilt = hero.grounded ? 0.07 : clamp(hero.vy * 0.00026, -0.16, 0.3);
  ctx.rotate(tilt);
  var sq = hero.squash;
  ctx.scale(u * (1 + Math.abs(sq) * 0.55), u * (1 - sq));
  var ph = hero.phase;
  var runA = Math.sin(ph);
  // cape (behind body, flowing back)
  var wave = Math.sin(time * 9) * 4 + (hero.grounded ? 0 : 7);
  var cg = ctx.createLinearGradient(-36, -60, 0, -30);
  cg.addColorStop(0, '#ff8a3c'); cg.addColorStop(1, '#e85d1f');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.moveTo(-2, -64);
  ctx.quadraticCurveTo(-30 - wave, -58, -36 - wave * 1.4, -34 + wave * 0.5);
  ctx.quadraticCurveTo(-20, -24, -4, -30);
  ctx.closePath(); ctx.fill();
  // legs (teal-dark suit pants, orange boots)
  ctx.lineCap = 'round';
  function leg(off) {
    var fx, fy;
    if (hero.grounded) { fx = Math.sin(ph + off) * 14; fy = -1 - Math.max(0, Math.cos(ph + off)) * 6; }
    else if (off === 0) { fx = 13; fy = -9; }
    else { fx = -11; fy = -4; }
    var kx = fx * 0.55 + 4, ky = -19;
    ctx.strokeStyle = '#0b7d74'; ctx.lineWidth = 7.5;
    ctx.beginPath(); ctx.moveTo(0, -33); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy - 3); ctx.stroke();
    ctx.fillStyle = '#ff8a3c';
    ctx.beginPath(); ctx.ellipse(fx + 2, fy - 2, 6, 3.6, 0, 0, Math.PI * 2); ctx.fill();
  }
  leg(Math.PI); leg(0);
  // body (teal suit)
  var bg2 = ctx.createLinearGradient(0, -68, 0, -30);
  bg2.addColorStop(0, '#1fd8bd'); bg2.addColorStop(1, '#0d9683');
  ctx.fillStyle = bg2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-10, -67, 21, 36, 8); else ctx.rect(-10, -67, 21, 36);
  ctx.fill();
  // belt + chest emblem
  ctx.fillStyle = '#ff8a3c'; ctx.fillRect(-10, -38, 21, 5);
  ctx.fillStyle = '#ffb03a';
  ctx.beginPath(); ctx.arc(1, -54, 5.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#7a3c00';
  ctx.beginPath();
  for (var i = 0; i < 5; i++) {
    var a = -Math.PI / 2 + i * (Math.PI * 2 / 5), a2 = a + Math.PI / 5;
    ctx.lineTo(1 + Math.cos(a) * 3.6, -54 + Math.sin(a) * 3.6);
    ctx.lineTo(1 + Math.cos(a2) * 1.6, -54 + Math.sin(a2) * 1.6);
  }
  ctx.closePath(); ctx.fill();
  // arms (swing opposite to legs)
  ctx.strokeStyle = '#0d9683'; ctx.lineWidth = 6.5;
  var aSwing = hero.grounded ? runA : 0.7;
  ctx.beginPath(); ctx.moveTo(3, -61); ctx.lineTo(3 + aSwing * 10, -46); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -61); ctx.lineTo(-2 - aSwing * 9, -47); ctx.stroke();
  ctx.fillStyle = '#f2c79b';
  ctx.beginPath(); ctx.arc(3 + aSwing * 10, -45, 3.6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-2 - aSwing * 9, -46, 3.6, 0, Math.PI * 2); ctx.fill();
  // head + mask
  ctx.fillStyle = '#f2c79b';
  ctx.beginPath(); ctx.arc(3, -77, 10.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#3a2a20';
  ctx.beginPath(); ctx.arc(3, -80.5, 10.5, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0b5e63';
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(-6.5, -81.5, 19, 8.5, 4); else ctx.rect(-6.5, -81.5, 19, 8.5);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(0.5, -77.5, 2.7, 1.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9, -77.5, 2.7, 1.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#b57a45'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(5, -70.5, 3.4, 0.35, Math.PI - 0.7); ctx.stroke();
  ctx.restore();
}
function drawRoofObs(b) {
  if (!b.obs) return;
  var top = b.topF * H;
  for (var i = 0; i < b.obs.length; i++) {
    var o = b.obs[i], x = b.x + o.dx - camX, base = top - 2;
    if (x < -80 || x > W + 80) continue;
    if (o.type === 'ac') {
      ctx.fillStyle = '#8d97a8'; ctx.fillRect(x - o.w / 2, base - o.h, o.w, o.h);
      ctx.fillStyle = '#aab4c4'; ctx.fillRect(x - o.w / 2, base - o.h, o.w, 6);
      ctx.strokeStyle = '#59637a'; ctx.lineWidth = 2; ctx.strokeRect(x - o.w / 2, base - o.h, o.w, o.h);
      ctx.fillStyle = '#39415a'; ctx.beginPath(); ctx.arc(x - 8, base - o.h / 2, 8, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#c7cedb'; ctx.lineWidth = 2;
      var fa = time * 9;
      for (var bl = 0; bl < 3; bl++) { ctx.beginPath(); ctx.moveTo(x - 8, base - o.h / 2); ctx.lineTo(x - 8 + Math.cos(fa + bl * 2.1) * 6.5, base - o.h / 2 + Math.sin(fa + bl * 2.1) * 6.5); ctx.stroke(); }
      ctx.fillStyle = '#59637a';
      for (var v = 0; v < 3; v++) ctx.fillRect(x + 8, base - o.h + 7 + v * 7, 11, 3);
    } else if (o.type === 'tank') {
      ctx.fillStyle = '#59637a';
      ctx.fillRect(x - o.w / 2 + 5, base - 8, 5, 8); ctx.fillRect(x + o.w / 2 - 10, base - 8, 5, 8);
      var tg = ctx.createLinearGradient(x - o.w / 2, 0, x + o.w / 2, 0);
      tg.addColorStop(0, '#7d8ca3'); tg.addColorStop(0.5, '#aeb9cc'); tg.addColorStop(1, '#66738c');
      ctx.fillStyle = tg;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x - o.w / 2, base - o.h, o.w, o.h - 6, 7); else ctx.rect(x - o.w / 2, base - o.h, o.w, o.h - 6);
      ctx.fill();
      ctx.strokeStyle = '#49536b'; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = '#8d99ae'; ctx.beginPath(); ctx.ellipse(x, base - o.h, o.w / 2 - 4, 5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#49536b'; ctx.fillRect(x - 2, base - o.h - 7, 4, 7);
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x - o.w / 2 + 6, base - o.h + 8, 5, o.h - 22);
    } else { // antenna mast with dish + beacon
      ctx.fillStyle = '#39415a'; ctx.fillRect(x - 11, base - 8, 22, 8);
      ctx.strokeStyle = '#9aa7bd'; ctx.lineWidth = 3.4;
      ctx.beginPath(); ctx.moveTo(x, base - 8); ctx.lineTo(x, base - o.h); ctx.stroke();
      ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(x - 10, base - o.h + 14); ctx.lineTo(x + 10, base - o.h + 14); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 7, base - o.h + 26); ctx.lineTo(x + 7, base - o.h + 26); ctx.stroke();
      ctx.strokeStyle = '#c7cedb';
      ctx.beginPath(); ctx.arc(x + 9, base - o.h + 6, 7, -0.9, 0.9); ctx.stroke();
      ctx.fillStyle = (Math.sin(time * 4 + x) > 0) ? '#ff5d5d' : '#7a2430';
      ctx.beginPath(); ctx.arc(x, base - o.h - 3, 3.2, 0, Math.PI * 2); ctx.fill();
    }
  }
}
function drawBird(bd) {
  var x = bd.wx - camX, y = bd.y + Math.sin(time * 7 + bd.ph) * 3;
  var flap = Math.sin(time * 17 + bd.ph);
  ctx.save(); ctx.translate(x, y);
  // far wing
  ctx.fillStyle = '#8d97a8';
  ctx.save(); ctx.rotate(-0.5 - flap * 0.55); ctx.beginPath(); ctx.ellipse(-2, -6, 15, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // tail
  ctx.fillStyle = '#788294';
  ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(23, -4); ctx.lineTo(23, 4); ctx.closePath(); ctx.fill();
  // body
  var bgd = ctx.createLinearGradient(0, -9, 0, 9);
  bgd.addColorStop(0, '#c3cad6'); bgd.addColorStop(1, '#98a2b5');
  ctx.fillStyle = bgd;
  ctx.beginPath(); ctx.ellipse(0, 0, 17, 9, 0, 0, Math.PI * 2); ctx.fill();
  // iridescent neck + head
  ctx.fillStyle = '#3fa08c'; ctx.beginPath(); ctx.arc(-13, -3, 6.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#aeb8c8'; ctx.beginPath(); ctx.arc(-16, -5, 6, 0, Math.PI * 2); ctx.fill();
  // beak + eye
  ctx.fillStyle = '#ffb03a';
  ctx.beginPath(); ctx.moveTo(-21, -5); ctx.lineTo(-28, -3); ctx.lineTo(-21, -1); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#14151f'; ctx.beginPath(); ctx.arc(-17.5, -6, 1.5, 0, Math.PI * 2); ctx.fill();
  // near wing
  ctx.fillStyle = '#aab4c4';
  ctx.save(); ctx.translate(-2, -2); ctx.rotate(-0.25 - flap * 0.7); ctx.beginPath(); ctx.ellipse(4, -5, 14, 4.6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  ctx.restore();
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // night sky
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b1030'); bg.addColorStop(0.6, '#1b1140'); bg.addColorStop(1, '#2a1650');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  // stars
  for (var i = 0; i < 60; i++) {
    var sx2 = hash(i * 3.3) * (W + 20) - 10, sy2 = hash(i * 7.9) * H * 0.5;
    ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.45 * Math.abs(Math.sin(time * 1.6 + i))) + ')';
    ctx.beginPath(); ctx.arc(sx2, sy2, i % 4 === 0 ? 1.9 : 1.1, 0, Math.PI * 2); ctx.fill();
  }
  // moon + glow
  var mg = ctx.createRadialGradient(W - 72, 88, 8, W - 72, 88, 74);
  mg.addColorStop(0, 'rgba(255,244,200,.5)'); mg.addColorStop(1, 'rgba(255,244,200,0)');
  ctx.fillStyle = mg; ctx.fillRect(W - 150, 10, 156, 156);
  ctx.fillStyle = '#fdf3c9';
  ctx.beginPath(); ctx.arc(W - 72, 88, 27, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e9dcae';
  ctx.beginPath(); ctx.arc(W - 82, 80, 5, 0, Math.PI * 2); ctx.arc(W - 62, 96, 4, 0, Math.PI * 2); ctx.arc(W - 70, 100, 3, 0, Math.PI * 2); ctx.fill();
  // parallax skyline
  drawSkyline(camX * 0.2, H * 0.88, 60, 150, '#171233', 0.35);
  drawSkyline(camX * 0.45, H * 0.95, 90, 215, '#201a49', 0.5);
  // game buildings
  for (i = 0; i < buildings.length; i++) {
    var b = buildings[i];
    if (b.x + b.w < camX - 60 || b.x > camX + W + 60) continue;
    drawBuilding(b);
  }
  // rooftop obstacles + pigeons
  for (i = 0; i < buildings.length; i++) {
    var b2 = buildings[i];
    if (b2.x + b2.w < camX - 60 || b2.x > camX + W + 60) continue;
    drawRoofObs(b2);
  }
  for (i = 0; i < birds.length; i++) drawBird(birds[i]);
  // coins
  for (i = 0; i < coinList.length; i++) {
    var c = coinList[i];
    drawCoinShape(c.x - camX, c.topF * H - c.yOff + Math.sin(time * 3 + c.ph) * 3, 13, c.ph);
  }
  // hero shadow on roof
  var gy = groundAt(camX + heroSX());
  if (gy !== Infinity && hero.y <= gy) {
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(heroSX(), gy + 4, 17 * (1 - Math.min(0.6, (gy - hero.y) / 300)), 4.5, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (hero.y < H + 60) drawHero();
  // particles
  for (i = 0; i < parts.length; i++) {
    var q = parts[i];
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < pops.length; i++) {
    var pp = pops[i];
    ctx.globalAlpha = 1 - pp.t / 0.95;
    ctx.font = '800 ' + (pp.big ? 27 : 20) + 'px system-ui, sans-serif';
    ctx.fillStyle = pp.c; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 4;
    ctx.strokeText(pp.txt, pp.x, pp.y); ctx.fillText(pp.txt, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ============ Loop ============ */
var lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000; lastT = ts;
  if (dt > 0.05) dt = 0.05;
  if (!document.hidden) { update(dt); draw(); }
}

/* ============ Input ============ */
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault(); ac();
  if (state === 'play') doJump();
});
window.addEventListener('pointerup', function () { hero.hold = false; });
window.addEventListener('pointercancel', function () { hero.hold = false; });
document.getElementById('startBtn').addEventListener('click', function (e) { e.stopPropagation(); startCountdown(); });
document.getElementById('againBtn').addEventListener('click', function (e) { e.stopPropagation(); queueRestart(); });
document.getElementById('muteBtn').addEventListener('click', function (e) {
  e.stopPropagation(); muted = !muted; this.textContent = muted ? '🔇' : '🔊'; if (!muted) ac();
});
document.addEventListener('visibilitychange', function () { lastT = 0; hero.hold = false; });

resize(); reset();
requestAnimationFrame(loop);
</script>
<div id="handHint" class="hhOn hhHold">👆</div>

<script>
/* Tutorial hand hint observer (owner, 2026-11-10): passive listeners
   only — the game's own input handlers are untouched. A pointerdown
   anywhere except on a UI button/panel counts as a meaningful input,
   as do Space/arrow keys. The first input of a run hides the hand for
   the rest of that run; hhRunStart() (called from the game's start
   function) opens a new run and re-shows the hand only if the
   previous run had fewer than 3 inputs. */
var hhEl = document.getElementById('handHint');
var hhInputs = 0, hhLive = false;
function hhRunStart(){ var prev = hhInputs; hhInputs = 0; hhLive = true; if (hhEl) hhEl.classList.toggle('hhOn', prev < 3); }
function hhNoteInput(){ if (!hhLive) return; hhInputs++; if (hhEl) hhEl.classList.remove('hhOn'); }
document.addEventListener('pointerdown', function (e) { var t = e.target; if (t && t.closest && t.closest('button, .panel, input, select, a')) return; hhNoteInput(); }, true);
document.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) hhNoteInput(); }, true);
</script>
