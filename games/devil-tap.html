<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Devil Tap — Rupiyo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#10131a; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; max-width:520px; margin:0 auto; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:0; left:0; right:0; padding:12px 14px; z-index:3; pointer-events:none; }
  #hudRow { display:flex; justify-content:space-between; align-items:center; }
  #scoreBox { font-size:30px; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  #timeBox { font-size:16px; font-weight:800; background:rgba(0,0,0,.4); padding:7px 14px; border-radius:999px; }
  #bestBox { font-size:13px; font-weight:700; background:rgba(0,0,0,.4); padding:6px 12px; border-radius:999px; }
  #muteBtn { pointer-events:auto; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.25); color:#fff; width:40px; height:40px; border-radius:50%; font-size:18px; cursor:pointer; }
  #timeWrap { height:12px; background:rgba(255,255,255,.15); border-radius:99px; margin-top:10px; overflow:hidden; }
  #timeBar { height:100%; width:100%; background:linear-gradient(90deg,#ff5d5d,#e08b00); border-radius:99px; }
  #centerMsg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:4; pointer-events:none; text-align:center; padding:20px; }
  #countNum { font-size:110px; font-weight:800; color:#f5c542; text-shadow:0 5px 0 #b97e00, 0 10px 30px rgba(0,0,0,.5); display:none; }
  .panel { background:rgba(13,16,22,.93); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:26px 30px; pointer-events:auto; box-shadow:0 18px 50px rgba(0,0,0,.55); max-width:88%; }
  .panel h1 { font-size:29px; margin-bottom:4px; }
  .panel h1 span { color:#ff5d5d; }
  .panel .sub { opacity:.78; font-size:14px; line-height:1.55; margin-bottom:14px; }
  .panel .bigscore { font-size:52px; font-weight:800; color:#f5c542; line-height:1; }
  .panel .bestline { font-size:14px; opacity:.8; margin:6px 0 16px; }
  .btn { display:inline-block; border:none; cursor:pointer; font-weight:800; border-radius:14px; padding:14px 26px; font-size:17px; background:linear-gradient(135deg,#f5c542,#e08b00); color:#231600; box-shadow:0 5px 14px rgba(0,0,0,.35); }
  .btn:active { transform:scale(.96); }
  .hidden { display:none !important; }

  /* Tutorial hand hint (owner, 2026-11-10): a looping hand overlay that
     demonstrates this game's primary input — the same help Bag Toss has
     always drawn for its throw. It never blocks input (pointer-events:
     none), shows from the start screen, hides for the rest of a run on
     the player's first meaningful input, and comes back on a new run
     only when the previous run had fewer than 3 inputs (the player is
     still learning). hhRunStart() is called by the game's own start
     function; visibility is the .hhOn class. */
  #handHint { position:fixed; z-index:60; pointer-events:none; display:none; font-size:56px; line-height:1; left:50%; margin-left:-28px; top:62%; filter:drop-shadow(0 3px 6px rgba(0,0,0,.55)); will-change:transform; }
  #handHint.hhOn { display:block; }
  #handHint.hhTap { animation:hhTapK 1.15s ease-in-out infinite; }
  @keyframes hhTapK { 0%,100% { transform:translateY(0) scale(1); } 35% { transform:translateY(10px) scale(.86); } 55% { transform:translateY(10px) scale(.86); } }
  #handHint.hhHold { animation:hhHoldK 1.9s ease-in-out infinite; }
  @keyframes hhHoldK { 0%,100% { transform:translateY(0); } 22% { transform:translateY(12px); } 68% { transform:translateY(12px); } }
  #handHint.hhSteer { animation:hhSteerK 1.7s ease-in-out infinite alternate; }
  @keyframes hhSteerK { from { transform:translateX(-48px); } to { transform:translateX(48px); } }
  #handHint.hhDrag { top:auto; bottom:15%; animation:hhSteerK 1.6s ease-in-out infinite alternate; }
  #handHint.hhTrace { animation:hhTraceK 2.2s linear infinite; }
  @keyframes hhTraceK { 0% { transform:translate(0,0); } 25% { transform:translate(30px,-10px); } 50% { transform:translate(4px,-26px); } 75% { transform:translate(-28px,-10px); } 100% { transform:translate(0,0); } }
  #handHint.hhPull { left:20%; margin-left:0; top:54%; animation:hhPullK 1.8s ease-in-out infinite; }
  @keyframes hhPullK { 0%,100% { transform:translate(0,0); } 45% { transform:translate(-32px,44px); } 60% { transform:translate(-32px,44px); } 74% { transform:translate(6px,-6px); } }
  #handHint.hhConnect { animation:hhConnectK 2s ease-in-out infinite; }
  @keyframes hhConnectK { 0%,100% { transform:translateX(-54px); } 12% { transform:translateX(-54px); } 55% { transform:translateX(54px); } 70% { transform:translateX(54px); } }
  #handHint.hhRight { left:auto; right:11%; margin-left:0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="hudRow">
      <div id="scoreBox">0</div>
      <div id="timeBox">⏱ 40</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div id="bestBox">🏆 0</div>
        <button id="muteBtn" title="Sound on/off">🔊</button>
      </div>
    </div>
    <div id="timeWrap"><div id="timeBar"></div></div>
  </div>
  <div id="centerMsg">
    <div id="countNum">3</div>
    <div class="panel" id="startPanel">
      <h1>😈 Devil <span>Tap</span></h1>
      <div class="sub">Devils pop out of the lava holes — bonk them fast!<br>⭐ Golden devil = <b>+5</b>. 💣 Bomb = <b>don't touch</b> (−3)!</div>
      <button class="btn" id="startBtn">▶ Play — 40s</button>
    </div>
    <div class="panel hidden" id="overPanel">
      <h1>Time Up!</h1>
      <div class="bigscore" id="finalScore">0</div>
      <div class="bestline" id="finalBest">Best: 0</div>
      <button class="btn" id="againBtn">↻ Play Again</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============ Rupiyo score bridge ============ */
var GAME_ID = 'devil-tap';
try { GAME_ID = new URLSearchParams(location.search).get('rp_game') || GAME_ID; } catch (e) {}
var scoreSent = false;
function reportScore(s) {
  if (scoreSent) return; scoreSent = true;
  s = Math.max(0, Math.floor(s));
  try { parent.postMessage({ type: 'rupiyo:score', game: GAME_ID, score: s }, '*'); } catch (e) {}
  try { if (window.RupiyoBridge && window.RupiyoBridge.postScore) window.RupiyoBridge.postScore(s); } catch (e) {}
}

/* ============ Interstitial ad helper ============ */
function rpAd(cb){ if(window.parent===window){ cb(); return; } var done=false; var fin=function(){ if(done) return; done=true; window.removeEventListener('message',h); cb(); }; var h=function(e){ if(e.data && e.data.type==='rupiyo:ad-done') fin(); }; window.addEventListener('message',h); try{ parent.postMessage({type:'rupiyo:ad',kind:'interstitial'},'*'); }catch(_){ } setTimeout(fin,5000); }
var restartQueued = false;
function queueRestart() {
  if (restartQueued) return; restartQueued = true;
  rpAd(function () { restartQueued = false; startCountdown(); });
}

/* ============ Audio (all synthesized) ============ */
var AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted) return; var c = ac(); if (!c) return;
  var t0 = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol, freq, q) {
  if (muted) return; var c = ac(); if (!c) return;
  var n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 800; f.Q.value = q || 0.8;
  var g = c.createGain(); g.gain.value = vol || 0.2;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
}
function sfxBonk() { tone(300, 0.12, 'square', 0.14, 90); noiseBurst(0.06, 0.12, 500, 1); }
function sfxGold() { tone(950, 0.08, 'square', 0.11); tone(1270, 0.08, 'square', 0.11, null, 0.07); tone(1900, 0.18, 'square', 0.11, null, 0.14); }
function sfxBomb() { noiseBurst(0.4, 0.34, 160, 0.5); tone(90, 0.4, 'sawtooth', 0.2, 32); }
function sfxPop() { tone(500, 0.06, 'sine', 0.05, 760); }
function sfxCount(final) { tone(final ? 880 : 440, final ? 0.22 : 0.12, 'sine', 0.14); }
function sfxEnd() { tone(660, 0.14, 'triangle', 0.14); tone(880, 0.14, 'triangle', 0.14, null, 0.13); tone(1180, 0.3, 'triangle', 0.16, null, 0.26); }

/* ============ Canvas setup ============ */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

/* ============ Game state ============ */
var ROUND = 40;
var state = 'ready'; // ready | count | play | over
var countT = 0, lastCount = 4;
var score = 0, best = 0, streak = 0;
try { best = parseInt(localStorage.getItem('rp_best_' + GAME_ID) || '0', 10) || 0; } catch (e) {}
var time = 0, timeLeft = ROUND, elapsed = 0, shake = 0, flash = 0, spawnT = 0;
var holes = [], parts = [], pops = [];

function gridGeom() {
  var top = 108, bottom = H - 24;
  var gh = (bottom - top) / 3, gw = W / 3;
  return { top: top, gw: gw, gh: gh };
}
function reset() {
  holes = [];
  for (var i = 0; i < 9; i++) holes.push({ ent: null, bonkT: 0, puffT: 0 });
  parts = []; pops = [];
  score = 0; streak = 0; timeLeft = ROUND; elapsed = 0; spawnT = 0.3; scoreSent = false; flash = 0;
  updateHud();
}
function updateHud() {
  document.getElementById('scoreBox').textContent = score;
  document.getElementById('bestBox').textContent = '🏆 ' + Math.max(best, score);
  document.getElementById('timeBox').textContent = '⏱ ' + Math.ceil(Math.max(0, timeLeft));
  document.getElementById('timeBar').style.width = (100 * Math.max(0, timeLeft) / ROUND) + '%';
}
function upWindow() { return Math.max(0.62, 1.12 - elapsed * 0.013); }   // seconds a devil stays up
function spawnInterval() { return Math.max(0.42, 0.9 - elapsed * 0.013); }
function spawn() {
  var empty = [];
  for (var i = 0; i < 9; i++) if (!holes[i].ent) empty.push(i);
  if (!empty.length) return;
  var idx = empty[Math.floor(Math.random() * empty.length)];
  var r = Math.random();
  var type = r < 0.13 ? 'bomb' : (r < 0.25 ? 'gold' : 'devil');
  holes[idx].ent = { type: type, t: 0, dur: upWindow() * (type === 'gold' ? 0.85 : 1), dead: false };
  sfxPop();
}
function burstStars(x, y, colors, n) {
  for (var i = 0; i < (n || 10); i++) {
    var a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 220;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 70, life: 0.45 + Math.random() * 0.3, t: 0, c: colors[i % colors.length], r: 2.5 + Math.random() * 3.5, star: Math.random() < 0.5 });
  }
}
function popup(x, y, txt, color, big) { pops.push({ x: x, y: y, txt: txt, t: 0, c: color || '#ffd94d', big: !!big }); }

function startCountdown() {
  if (typeof hhRunStart === 'function') hhRunStart();   // tutorial hand: a new run begins
  reset();
  state = 'count'; countT = 0; lastCount = 4;
  document.getElementById('startPanel').classList.add('hidden');
  document.getElementById('overPanel').classList.add('hidden');
  document.getElementById('countNum').style.display = 'block';
  ac();
}
function gameOver() {
  state = 'over';
  for (var i = 0; i < 9; i++) holes[i].ent = null;
  sfxEnd();
  if (score > best) { best = score; try { localStorage.setItem('rp_best_' + GAME_ID, String(best)); } catch (e) {} }
  reportScore(score);
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalBest').textContent = 'Best: ' + best;
  document.getElementById('overPanel').classList.remove('hidden');
  updateHud();
}
function holeCenter(i) {
  var g = gridGeom();
  return { x: (i % 3) * g.gw + g.gw / 2, y: g.top + Math.floor(i / 3) * g.gh + g.gh * 0.58, gw: g.gw, gh: g.gh };
}
function tapAt(px, py) {
  var g = gridGeom();
  var col = Math.floor(px / g.gw), row = Math.floor((py - g.top) / g.gh);
  if (col < 0 || col > 2 || row < 0 || row > 2) return;
  var i = row * 3 + col, h = holes[i], c = holeCenter(i);
  var R = g.gw * 0.34;
  if (h.ent && !h.ent.dead && h.ent.t > 0.12) {
    var rise = riseOf(h.ent);
    var hx = c.x, hy = c.y - rise * R * 1.15;
    var dx = px - hx, dy = py - hy;
    if (dx * dx + dy * dy <= (R * 1.25) * (R * 1.25)) {
      var ent = h.ent;
      if (ent.type === 'bomb') {
        score = Math.max(0, score - 3); streak = 0;
        h.ent = null; h.bonkT = 0.001;
        shake = 15; flash = 0.5;
        burstStars(c.x, c.y - 20, ['#ff5d5d', '#ffb03a', '#555c66'], 18);
        popup(c.x, c.y - 56, '−3 💣', '#ff6b6b', true);
        sfxBomb();
        if (navigator.vibrate) { try { navigator.vibrate(120); } catch (e) {} }
      } else {
        var pts = ent.type === 'gold' ? 5 : 1;
        score += pts; streak++;
        ent.dead = true; ent.t = ent.dur; // start duck-out with squash
        h.bonkT = 0.0001;
        burstStars(hx, hy, ent.type === 'gold' ? ['#ffd94d', '#fff3b0', '#ffb03a'] : ['#ffd94d', '#ff8fa3', '#ffffff'], ent.type === 'gold' ? 16 : 10);
        popup(hx, hy - R - 8, '+' + pts + (ent.type === 'gold' ? ' ⭐' : ''), ent.type === 'gold' ? '#ffd94d' : '#b6ff7a', ent.type === 'gold');
        if (ent.type === 'gold') sfxGold(); else sfxBonk();
      }
      updateHud();
      return;
    }
  }
  // tapped empty ground/hole: little dust puff, streak resets only if a devil was up nearby? keep friendly: no penalty
  h.puffT = 0.0001;
}
function riseOf(ent) {
  // 0 hidden → 1 fully up → 0 hidden, with squash when dead
  var p = ent.t / ent.dur;
  if (ent.dead) return Math.max(0, 1 - (ent.t - ent.dur) / 0.16);
  if (p < 0.18) { var q = p / 0.18; return q * q * (3 - 2 * q); }
  if (p > 0.8) { var q2 = (p - 0.8) / 0.2; return 1 - q2 * q2; }
  return 1;
}

/* ============ Update ============ */
function update(dt) {
  time += dt;
  var i, p;
  for (i = parts.length - 1; i >= 0; i--) { p = parts[i]; p.t += dt; p.vy += 650 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) parts.splice(i, 1); }
  for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; pops[i].y -= 52 * dt; if (pops[i].t > 0.95) pops.splice(i, 1); }
  if (shake > 0) shake = Math.max(0, shake - dt * 34);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.4);
  for (i = 0; i < 9; i++) {
    if (holes[i].bonkT > 0) { holes[i].bonkT += dt; if (holes[i].bonkT > 0.3) holes[i].bonkT = 0; }
    if (holes[i].puffT > 0) { holes[i].puffT += dt; if (holes[i].puffT > 0.3) holes[i].puffT = 0; }
  }

  if (state === 'count') {
    countT += dt;
    var n = 3 - Math.floor(countT);
    if (n !== lastCount && n >= 1) { lastCount = n; sfxCount(false); var el = document.getElementById('countNum'); el.textContent = n; el.style.transform = 'scale(1.25)'; setTimeout(function () { el.style.transform = 'scale(1)'; }, 90); }
    if (countT >= 3) { state = 'play'; document.getElementById('countNum').style.display = 'none'; sfxCount(true); }
    return;
  }
  if (state !== 'play') return;

  elapsed += dt;
  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; updateHud(); gameOver(); return; }

  spawnT -= dt;
  if (spawnT <= 0) { spawn(); if (elapsed > 14 && Math.random() < 0.45) spawn(); spawnT = spawnInterval() * (0.7 + Math.random() * 0.6); }
  for (i = 0; i < 9; i++) {
    var h = holes[i];
    if (h.ent) {
      h.ent.t += dt;
      if (h.ent.dead && h.ent.t - h.ent.dur > 0.18) h.ent = null;
      else if (!h.ent.dead && h.ent.t >= h.ent.dur) { h.ent = null; }
    }
  }
  updateHud();
}

/* ============ Draw ============ */
function drawStar(x, y, r, rot) {
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var a = rot + i * Math.PI / 4, rad = i % 2 === 0 ? r : r * 0.45;
    var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}
function drawDevil(cx, cy, R, type, rise, bonk, t) {
  var squash = 1, stretch = 1;
  if (bonk > 0) { var b = Math.sin((bonk / 0.3) * Math.PI); squash = 1 - 0.45 * b; stretch = 1 + 0.3 * b; }
  var bodyH = R * 2.1 * rise;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(stretch, squash);
  // clip lower part so it emerges from the hole
  ctx.beginPath(); ctx.rect(-R * 1.5, -R * 2.4, R * 3, bodyH + R * 0.4); ctx.clip();
  var hy = -bodyH + R * 0.9;
  var gold = type === 'gold';
  var main = gold ? '#f5c542' : '#e63946', dark = gold ? '#b97e00' : '#9d1b29', horn = gold ? '#fff3b0' : '#ffd6a5';
  // horns
  ctx.fillStyle = horn;
  ctx.beginPath(); ctx.moveTo(-R * 0.72, hy - R * 0.42); ctx.quadraticCurveTo(-R * 1.05, hy - R * 1.05, -R * 0.38, hy - R * 0.86); ctx.quadraticCurveTo(-R * 0.5, hy - R * 0.5, -R * 0.34, hy - R * 0.34); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(R * 0.72, hy - R * 0.42); ctx.quadraticCurveTo(R * 1.05, hy - R * 1.05, R * 0.38, hy - R * 0.86); ctx.quadraticCurveTo(R * 0.5, hy - R * 0.5, R * 0.34, hy - R * 0.34); ctx.closePath(); ctx.fill();
  // head
  var g = ctx.createRadialGradient(-R * 0.3, hy - R * 0.3, R * 0.2, 0, hy, R * 1.05);
  g.addColorStop(0, gold ? '#ffe98a' : '#ff7585'); g.addColorStop(1, main);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, hy, R * 0.92, 0, 7); ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 2.5; ctx.stroke();
  // cheeks
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(-R * 0.52, hy + R * 0.28, R * 0.17, 0, 7); ctx.arc(R * 0.52, hy + R * 0.28, R * 0.17, 0, 7); ctx.fill();
  // eyes (look side to side)
  var lx = Math.sin(t * 2.2 + cx) * R * 0.07;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-R * 0.33 + lx, hy - R * 0.12, R * 0.2, 0, 7); ctx.arc(R * 0.33 + lx, hy - R * 0.12, R * 0.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#231600';
  ctx.beginPath(); ctx.arc(-R * 0.33 + lx * 1.6, hy - R * 0.1, R * 0.1, 0, 7); ctx.arc(R * 0.33 + lx * 1.6, hy - R * 0.1, R * 0.1, 0, 7); ctx.fill();
  // cheeky grin with fang
  ctx.strokeStyle = '#5c0a14'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(0, hy + R * 0.18, R * 0.42, 0.25, Math.PI - 0.25); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-R * 0.3, hy + R * 0.42); ctx.lineTo(-R * 0.16, hy + R * 0.42); ctx.lineTo(-R * 0.23, hy + R * 0.62); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(R * 0.16, hy + R * 0.42); ctx.lineTo(R * 0.3, hy + R * 0.42); ctx.lineTo(R * 0.23, hy + R * 0.62); ctx.closePath(); ctx.fill();
  if (gold) { ctx.font = (R * 0.7) + 'px system-ui'; ctx.textAlign = 'center'; ctx.fillText('⭐', 0, hy - R * 1.15); }
  ctx.restore();
}
function drawBomb(cx, cy, R, rise, t) {
  var bodyH = R * 2.1 * rise;
  ctx.save(); ctx.translate(cx, cy);
  ctx.beginPath(); ctx.rect(-R * 1.5, -R * 2.4, R * 3, bodyH + R * 0.4); ctx.clip();
  var by = -bodyH + R * 0.95;
  ctx.fillStyle = '#2b2f36';
  ctx.beginPath(); ctx.arc(0, by, R * 0.8, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.arc(-R * 0.28, by - R * 0.3, R * 0.2, 0, 7); ctx.fill();
  ctx.fillStyle = '#555c66'; ctx.fillRect(-R * 0.12, by - R * 1.02, R * 0.24, R * 0.24);
  // fuse + spark
  ctx.strokeStyle = '#c9a86a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, by - R * 1.0); ctx.quadraticCurveTo(R * 0.3, by - R * 1.35, R * 0.5, by - R * 1.28); ctx.stroke();
  var sp = 1 + Math.sin(t * 26) * 0.3;
  ctx.fillStyle = '#ffb03a';
  drawStar(R * 0.52, by - R * 1.3, R * 0.22 * sp, t * 3);
  ctx.fillStyle = '#ff5d5d';
  drawStar(R * 0.52, by - R * 1.3, R * 0.11 * sp, t * 3 + 0.4);
  ctx.restore();
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  // volcanic backdrop
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#1c1024'); bg.addColorStop(0.55, '#2a1230'); bg.addColorStop(1, '#170a18');
  ctx.fillStyle = bg; ctx.fillRect(-20, -20, W + 40, H + 40);
  // ember specks
  ctx.fillStyle = 'rgba(255,140,60,.35)';
  for (var i = 0; i < 22; i++) {
    var ex = (i * 89.7) % (W + 20) - 10, ey = H - ((time * (14 + (i % 5) * 6) + i * 61) % (H + 30));
    ctx.beginPath(); ctx.arc(ex, ey, 1.6 + (i % 3), 0, 7); ctx.fill();
  }
  var g = gridGeom();
  // devils behind hole rims: draw entities first, then front rim
  for (i = 0; i < 9; i++) {
    var c = holeCenter(i), h = holes[i], R = g.gw * 0.34;
    // hole pit
    var hg = ctx.createRadialGradient(c.x, c.y, 4, c.x, c.y, R * 1.35);
    hg.addColorStop(0, '#0a0508'); hg.addColorStop(0.75, '#1d0b10'); hg.addColorStop(1, 'rgba(29,11,16,0)');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.ellipse(c.x, c.y, R * 1.35, R * 0.62, 0, 0, 7); ctx.fill();
    if (h.ent) {
      var rise = riseOf(h.ent);
      if (rise > 0.02) {
        if (h.ent.type === 'bomb') drawBomb(c.x, c.y + 4, R, rise, time);
        else drawDevil(c.x, c.y + 4, R, h.ent.type, rise, h.bonkT, time);
      }
    }
    // lava rim (front lip over the body)
    ctx.fillStyle = '#3d1522';
    ctx.beginPath(); ctx.ellipse(c.x, c.y, R * 1.28, R * 0.55, 0, 0, Math.PI); ctx.fill();
    var lg = ctx.createRadialGradient(c.x, c.y + 4, 2, c.x, c.y + 4, R * 1.1);
    lg.addColorStop(0, 'rgba(255,110,40,.55)'); lg.addColorStop(1, 'rgba(255,110,40,0)');
    ctx.fillStyle = lg;
    ctx.beginPath(); ctx.ellipse(c.x, c.y + 2, R * 1.12, R * 0.44, 0, 0, Math.PI); ctx.fill();
    ctx.strokeStyle = 'rgba(255,120,50,.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(c.x, c.y, R * 1.28, R * 0.55, 0, 0.15, Math.PI - 0.15); ctx.stroke();
    if (h.puffT > 0) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.35 * (1 - h.puffT / 0.3)) + ')';
      ctx.beginPath(); ctx.arc(c.x, c.y - 8 - h.puffT * 30, 8 + h.puffT * 22, 0, 7); ctx.fill();
    }
  }
  // particles
  for (i = 0; i < parts.length; i++) {
    var q = parts[i];
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c;
    if (q.star) drawStar(q.x, q.y, q.r * 2, q.t * 6);
    else { ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < pops.length; i++) {
    var pp = pops[i];
    ctx.globalAlpha = 1 - pp.t / 0.95;
    ctx.font = '800 ' + (pp.big ? 27 : 20) + 'px system-ui, sans-serif';
    ctx.fillStyle = pp.c; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 4;
    ctx.strokeText(pp.txt, pp.x, pp.y); ctx.fillText(pp.txt, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = 'rgba(255,40,30,' + (flash * 0.4) + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
}

/* ============ Loop ============ */
var lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000; lastT = ts;
  if (dt > 0.05) dt = 0.05;
  if (!document.hidden) { update(dt); draw(); }
}

/* ============ Input ============ */
function toGame(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault(); ac();
  if (state === 'play') { var pt = toGame(e); tapAt(pt.x, pt.y); }
});
document.getElementById('startBtn').addEventListener('click', function (e) { e.stopPropagation(); startCountdown(); });
document.getElementById('againBtn').addEventListener('click', function (e) { e.stopPropagation(); queueRestart(); });
document.getElementById('muteBtn').addEventListener('click', function (e) {
  e.stopPropagation(); muted = !muted; this.textContent = muted ? '🔇' : '🔊'; if (!muted) ac();
});
document.addEventListener('visibilitychange', function () { lastT = 0; });

resize(); reset();
requestAnimationFrame(loop);
</script>
<div id="handHint" class="hhOn hhTap">👆</div>

<script>
/* Tutorial hand hint observer (owner, 2026-11-10): passive listeners
   only — the game's own input handlers are untouched. A pointerdown
   anywhere except on a UI button/panel counts as a meaningful input,
   as do Space/arrow keys. The first input of a run hides the hand for
   the rest of that run; hhRunStart() (called from the game's start
   function) opens a new run and re-shows the hand only if the
   previous run had fewer than 3 inputs. */
var hhEl = document.getElementById('handHint');
var hhInputs = 0, hhLive = false;
function hhRunStart(){ var prev = hhInputs; hhInputs = 0; hhLive = true; if (hhEl) hhEl.classList.toggle('hhOn', prev < 3); }
function hhNoteInput(){ if (!hhLive) return; hhInputs++; if (hhEl) hhEl.classList.remove('hhOn'); }
document.addEventListener('pointerdown', function (e) { var t = e.target; if (t && t.closest && t.closest('button, .panel, input, select, a')) return; hhNoteInput(); }, true);
document.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) hhNoteInput(); }, true);
</script>
