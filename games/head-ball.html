<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Head Ball — Rupiyo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#0d2136; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; max-width:520px; margin:0 auto; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:0; left:0; right:0; padding:12px 14px; z-index:3; pointer-events:none; }
  #hudRow { display:flex; justify-content:space-between; align-items:center; }
  #scoreBox { font-size:34px; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  #timeBox { font-size:16px; font-weight:800; background:rgba(0,0,0,.45); padding:7px 14px; border-radius:999px; }
  #livesBox { font-size:15px; font-weight:800; background:rgba(0,0,0,.45); padding:7px 12px; border-radius:999px; letter-spacing:1px; }
  #bestBox { font-size:13px; font-weight:700; background:rgba(0,0,0,.45); padding:6px 12px; border-radius:999px; }
  .hbtn { pointer-events:auto; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.25); color:#fff; width:40px; height:40px; border-radius:50%; font-size:18px; cursor:pointer; }
  #timeWrap { height:12px; background:rgba(255,255,255,.18); border-radius:99px; margin-top:10px; overflow:hidden; }
  #timeBar { height:100%; width:100%; background:linear-gradient(90deg,#39d353,#a3e635); border-radius:99px; }
  #centerMsg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:4; pointer-events:none; text-align:center; padding:20px; }
  #countNum { font-size:110px; font-weight:800; color:#f5c542; text-shadow:0 5px 0 #b97e00, 0 10px 30px rgba(0,0,0,.5); display:none; }
  .panel { background:rgba(10,18,28,.94); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:26px 30px; pointer-events:auto; box-shadow:0 18px 50px rgba(0,0,0,.55); max-width:88%; }
  .panel h1 { font-size:29px; margin-bottom:4px; }
  .panel h1 span { color:#7ee787; }
  .panel .sub { opacity:.82; font-size:14px; line-height:1.55; margin-bottom:14px; }
  .panel .bigscore { font-size:52px; font-weight:800; color:#f5c542; line-height:1; }
  .panel .bestline { font-size:14px; opacity:.8; margin:6px 0 16px; }
  .btn { display:inline-block; border:none; cursor:pointer; font-weight:800; border-radius:14px; padding:14px 26px; font-size:17px; background:linear-gradient(135deg,#7ee787,#2ea043); color:#06280f; box-shadow:0 5px 14px rgba(0,0,0,.35); }
  .btn:active { transform:scale(.96); }
  .hidden { display:none !important; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="hudRow">
      <div id="scoreBox">0</div>
      <div id="livesBox">❤️❤️❤️</div>
      <div id="timeBox">⏱ 60</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div id="bestBox">🏆 0</div>
        <button class="hbtn" id="muteBtn" title="Sound on/off">🔊</button>
      </div>
    </div>
    <div id="timeWrap"><div id="timeBar"></div></div>
  </div>
  <div id="centerMsg">
    <div id="countNum">3</div>
    <div class="panel" id="startPanel">
      <h1>⚽ Head <span>Ball</span></h1>
      <div class="sub">⚽ Head Ball — Drag the head to keep the ball up. Every clean header = +1. Don't let it drop — 3 lives, 60 seconds!</div>
      <button class="btn" id="startBtn">▶ Play — 60s</button>
    </div>
    <div class="panel hidden" id="overPanel">
      <h1 id="overTitle">Time Up!</h1>
      <div class="bigscore" id="finalScore">0</div>
      <div class="bestline" id="finalLine">⚽ 0 headers</div>
      <div class="bestline" id="finalBest">Best: 0</div>
      <button class="btn" id="againBtn">↻ Play Again</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============ Rupiyo score bridge ============ */
var GAME_ID = 'head-ball';
try { GAME_ID = new URLSearchParams(location.search).get('rp_game') || GAME_ID; } catch (e) {}
var scoreSent = false;
function reportScore(s) {
  if (scoreSent) return; scoreSent = true;
  s = Math.max(0, Math.floor(s));
  try { parent.postMessage({ type: 'rupiyo:score', game: GAME_ID, score: s }, '*'); } catch (e) {}
  try { if (window.RupiyoBridge && window.RupiyoBridge.postScore) window.RupiyoBridge.postScore(s); } catch (e) {}
}

/* ============ Interstitial ad helper (parent app shows the ad) ============ */
function rpAd(cb){ if(window.parent===window){ cb(); return; } let done=false; const fin=()=>{ if(done) return; done=true; window.removeEventListener('message',h); cb(); }; const h=e=>{ if(e.data && e.data.type==='rupiyo:ad-done') fin(); }; window.addEventListener('message',h); try{ parent.postMessage({type:'rupiyo:ad',kind:'interstitial'},'*'); }catch(_){ } setTimeout(fin,5000); }

/* ============ Audio (all synthesized) ============ */
var AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted) return; var c = ac(); if (!c) return;
  var t0 = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol, freq, q) {
  if (muted) return; var c = ac(); if (!c) return;
  var n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 800; f.Q.value = q || 0.8;
  var g = c.createGain(); g.gain.value = vol || 0.2;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
}
function sfxHead(combo) { var f = 480 + Math.min(420, combo * 34); tone(f, 0.1, 'square', 0.12, f * 1.5); noiseBurst(0.05, 0.1, 900, 1); }
function sfxSoft() { tone(280, 0.05, 'sine', 0.05); }
function sfxWall() { tone(220, 0.05, 'sine', 0.06); }
function sfxDrop() { tone(420, 0.4, 'sine', 0.15, 70); noiseBurst(0.25, 0.12, 300, 0.7); }
function sfxCount(final) { tone(final ? 880 : 440, final ? 0.22 : 0.12, 'sine', 0.14); }
function sfxEnd() { tone(660, 0.14, 'triangle', 0.14); tone(880, 0.14, 'triangle', 0.14, null, 0.13); tone(1180, 0.3, 'triangle', 0.16, null, 0.26); }

/* ============ Canvas setup ============ */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

/* ============ Game state ============ */
var ROUND = 60;
var state = 'ready'; // ready | count | play | over
var countT = 0, lastCount = 4;
var score = 0, best = 0, juggles = 0, combo = 0, lives = 3;
try { best = parseInt(localStorage.getItem('rp_best_' + GAME_ID) || '0', 10) || 0; } catch (e) {}
var time = 0, timeLeft = ROUND, shake = 0, flash = 0;
var head = { x: 0, y: 0, tx: 0, ty: 0, px: 0 };
var headVelX = 0;
var ball = { x: 0, y: 0, vx: 0, vy: 0, spin: 0, wait: 0, trail: [] };
var parts = [], pops = [];
/* Anti-farm: a header only COUNTS when (a) >=240ms since the last counted
   header AND (b) the ball has risen >=140px above the last counted bounce
   point since then (counterArmed flips back on only when that happens).
   (c) Every counted header also fires the ball off at a random horizontal
   speed, so it can never be camped in one vertical lane. */
var counterArmed = true, lastBounceY = 0, lastHeadTime = -99;

function headR() { return clamp(W * 0.125, 42, 62); }
function ballR() { return clamp(W * 0.052, 20, 30); }
function reset() {
  juggles = 0; score = 0; combo = 0; lives = 3; timeLeft = ROUND;
  parts = []; pops = [];
  head.x = head.tx = W / 2; head.y = head.ty = H * 0.36; head.px = head.x; headVelX = 0;
  counterArmed = true; lastBounceY = 0; lastHeadTime = -99;
  respawnBall();
  ball.wait = 0;
  scoreSent = false; shake = 0; flash = 0;
  updateHud();
}
function respawnBall() {
  ball.x = W / 2 + (Math.random() - 0.5) * W * 0.2;
  ball.y = H * 0.14;
  ball.vx = (Math.random() - 0.5) * 90;
  ball.vy = 0; ball.spin = 0; ball.trail = [];
  counterArmed = true; // a fresh ball always starts countable
}
function updateHud() {
  document.getElementById('scoreBox').textContent = juggles;
  document.getElementById('bestBox').textContent = '🏆 ' + Math.max(best, juggles);
  document.getElementById('timeBox').textContent = '⏱ ' + Math.ceil(Math.max(0, timeLeft));
  document.getElementById('timeBar').style.width = (100 * Math.max(0, timeLeft) / ROUND) + '%';
  var lv = '';
  for (var i = 0; i < 3; i++) lv += i < lives ? '❤️' : '🖤';
  document.getElementById('livesBox').textContent = lv;
}
function burst(x, y, colors, n) {
  for (var i = 0; i < (n || 10); i++) {
    var a = Math.random() * Math.PI * 2, v = 70 + Math.random() * 210;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.4 + Math.random() * 0.3, t: 0, c: colors[i % colors.length], r: 2 + Math.random() * 3.4 });
  }
}
function popup(x, y, txt, color, big) { pops.push({ x: x, y: y, txt: txt, t: 0, c: color || '#ffd94d', big: !!big }); }

function startCountdown() {
  reset();
  state = 'count'; countT = 0; lastCount = 4;
  document.getElementById('startPanel').classList.add('hidden');
  document.getElementById('overPanel').classList.add('hidden');
  document.getElementById('countNum').style.display = 'block';
  ac();
}
function gameOver(reason) {
  state = 'over';
  sfxEnd();
  score = juggles;
  if (score > best) { best = score; try { localStorage.setItem('rp_best_' + GAME_ID, String(best)); } catch (e) {} }
  reportScore(score);
  document.getElementById('overTitle').textContent = reason === 'lives' ? '💔 Out of Lives!' : '⏰ Time Up!';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('finalLine').textContent = '⚽ ' + juggles + ' headers';
  document.getElementById('finalBest').textContent = 'Best: ' + best;
  document.getElementById('overPanel').classList.remove('hidden');
  updateHud();
}
function dropBall() {
  lives--; combo = 0;
  flash = 0.55; shake = 10;
  sfxDrop();
  if (navigator.vibrate) { try { navigator.vibrate(90); } catch (e) {} }
  burst(ball.x, H - 14, ['#cfd8dc', '#90a4ae', '#ffffff'], 12);
  updateHud();
  if (lives <= 0) { gameOver('lives'); return; }
  popup(W / 2, H * 0.42, 'Dropped! ' + lives + (lives === 1 ? ' life' : ' lives') + ' left', '#ff8fa3', true);
  ball.wait = 0.9;
  ball.y = -60; ball.vy = 0;
}

/* ============ Update ============ */
function update(dt) {
  time += dt;
  var i, p;
  for (i = parts.length - 1; i >= 0; i--) { p = parts[i]; p.t += dt; p.vy += 620 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.t > p.life) parts.splice(i, 1); }
  for (i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; pops[i].y -= 52 * dt; if (pops[i].t > 0.95) pops.splice(i, 1); }
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.5);

  if (state === 'count') {
    countT += dt;
    var n = 3 - Math.floor(countT);
    if (n !== lastCount && n >= 1) { lastCount = n; sfxCount(false); var el = document.getElementById('countNum'); el.textContent = n; el.style.transform = 'scale(1.25)'; setTimeout(function () { el.style.transform = 'scale(1)'; }, 90); }
    if (countT >= 3) { state = 'play'; document.getElementById('countNum').style.display = 'none'; sfxCount(true); }
    smoothHead(dt);
    return;
  }
  if (state !== 'play') { smoothHead(dt); return; }

  timeLeft -= dt;
  if (timeLeft <= 0) { timeLeft = 0; updateHud(); gameOver('time'); return; }

  smoothHead(dt);

  // --- ball ---
  var br = ballR();
  if (ball.wait > 0) {
    ball.wait -= dt;
    if (ball.wait <= 0) respawnBall();
  } else {
    ball.vy += 1580 * dt;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    ball.spin += (ball.vx * 0.012 + 2.2) * dt;
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 7) ball.trail.shift();
    // anti-farm (b): re-arm the counter only once the ball has risen at
    // least 140px above the point of the last counted header
    if (!counterArmed && ball.y <= lastBounceY - 140) counterArmed = true;
    // walls / ceiling
    if (ball.x < br) { ball.x = br; ball.vx = Math.abs(ball.vx) * 0.88; sfxWall(); }
    if (ball.x > W - br) { ball.x = W - br; ball.vx = -Math.abs(ball.vx) * 0.88; sfxWall(); }
    if (ball.y < br) { ball.y = br; ball.vy = Math.abs(ball.vy) * 0.85; }
    // head bounce: ball falling + overlapping the head
    var hr = headR();
    var dx = ball.x - head.x, dy = ball.y - head.y;
    var rr = hr + br * 0.6;
    if (ball.vy > 0 && dx * dx + dy * dy < rr * rr && ball.y < head.y + hr * 0.5) {
      ball.y = head.y - rr * 0.85;
      // anti-farm (a): >=240ms since the last counted header
      var counts = counterArmed && (time - lastHeadTime >= 0.24);
      if (counts) {
        lastHeadTime = time;
        counterArmed = false;
        lastBounceY = ball.y;
        ball.vy = -(655 + Math.min(250, juggles * 3) + Math.random() * 30);
        // anti-farm (c): random horizontal kick — the ball never stays in one lane
        ball.vx = (Math.random() < 0.5 ? -1 : 1) * (120 + Math.random() * 160);
        juggles++; combo++;
        burst(ball.x, ball.y + br * 0.7, ['#ffd94d', '#7ee787', '#ffffff'], 11);
        popup(ball.x, ball.y - br - 14, '+1' + (combo >= 5 ? ' 🔥×' + combo : ''), combo >= 5 ? '#ffb03a' : '#b6ff7a', combo >= 5);
        sfxHead(combo);
        shake = Math.max(shake, 3);
      } else {
        // physical bounce only — soft, no score, no popup (anti-farm d)
        ball.vy = -(470 + Math.random() * 30);
        ball.vx = clamp(ball.vx * 0.6 + dx * 2.2 + headVelX * 0.15, -320, 320);
        sfxSoft();
      }
      updateHud();
    }
    // dropped
    if (ball.y - br > H + 12) { dropBall(); if (state !== 'play') return; }
  }
  updateHud();
}
function smoothHead(dt) {
  head.px = head.x;
  var k = Math.min(1, dt * 20);
  head.x += (head.tx - head.x) * k;
  head.y += (head.ty - head.y) * k;
  if (dt > 0.001) {
    var v = (head.x - head.px) / dt;
    headVelX = headVelX * 0.65 + v * 0.35;
  }
}

/* ============ Draw ============ */
function drawBackground() {
  // stadium at night backdrop
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d2136'); bg.addColorStop(0.62, '#123a2c'); bg.addColorStop(0.63, '#14532d'); bg.addColorStop(1, '#166534');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  // floodlights
  for (var i = 0; i < 3; i++) {
    var lx = W * (0.18 + i * 0.32), ly = H * 0.1;
    var fg = ctx.createRadialGradient(lx, ly, 4, lx, ly, 90);
    fg.addColorStop(0, 'rgba(255,250,205,.5)'); fg.addColorStop(1, 'rgba(255,250,205,0)');
    ctx.fillStyle = fg; ctx.fillRect(lx - 90, ly - 90, 180, 180);
    ctx.fillStyle = '#fef9c3'; ctx.beginPath(); ctx.arc(lx, ly, 6, 0, Math.PI * 2); ctx.fill();
  }
  // crowd dots
  for (var j = 0; j < 130; j++) {
    var cxp = ((j * 53.7) % (W + 10)) - 5, cyp = H * 0.3 + ((j * 31.3) % (H * 0.28));
    ctx.fillStyle = 'hsla(' + ((j * 47) % 360) + ',65%,62%,.5)';
    ctx.beginPath(); ctx.arc(cxp, cyp, 2.1, 0, Math.PI * 2); ctx.fill();
  }
  // pitch stripes + line
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  for (var s = 0; s < 5; s++) ctx.fillRect(0, H * (0.66 + s * 0.085), W, H * 0.042);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, H * 0.63); ctx.lineTo(W, H * 0.63); ctx.stroke();
}
function drawHead() {
  var hr = headR();
  ctx.save();
  // glow
  var g = ctx.createRadialGradient(head.x, head.y, hr * 0.2, head.x, head.y, hr * 1.45);
  g.addColorStop(0, 'rgba(126,231,135,.34)');
  g.addColorStop(1, 'rgba(126,231,135,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(head.x, head.y, hr * 1.45, 0, Math.PI * 2); ctx.fill();
  // face medallion
  var fg = ctx.createRadialGradient(head.x - hr * 0.3, head.y - hr * 0.35, hr * 0.25, head.x, head.y, hr);
  fg.addColorStop(0, '#ffd9ae'); fg.addColorStop(1, '#eda96a');
  ctx.beginPath(); ctx.arc(head.x, head.y, hr, 0, Math.PI * 2);
  ctx.fillStyle = fg; ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#7ee787';
  ctx.stroke();
  // hair cap
  ctx.fillStyle = '#5b3a1e';
  ctx.beginPath(); ctx.arc(head.x, head.y - hr * 0.12, hr * 0.94, Math.PI * 1.08, Math.PI * 1.92); ctx.closePath(); ctx.fill();
  // eyes
  ctx.fillStyle = '#263238';
  ctx.beginPath(); ctx.arc(head.x - hr * 0.34, head.y - hr * 0.1, hr * 0.085, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(head.x + hr * 0.34, head.y - hr * 0.1, hr * 0.085, 0, Math.PI * 2); ctx.fill();
  // smile
  ctx.strokeStyle = '#263238';
  ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(head.x, head.y + hr * 0.14, hr * 0.42, 0.3, Math.PI - 0.3); ctx.stroke();
  ctx.restore();
}
function drawBall() {
  var br = ballR();
  if (ball.wait > 0) return;
  // trail
  for (var i = 0; i < ball.trail.length; i++) {
    var t = ball.trail[i];
    ctx.fillStyle = 'rgba(255,255,255,' + (0.05 + 0.1 * i / ball.trail.length) + ')';
    ctx.beginPath(); ctx.arc(t.x, t.y, br * (0.4 + 0.5 * i / ball.trail.length), 0, Math.PI * 2); ctx.fill();
  }
  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.spin);
  var g = ctx.createRadialGradient(-br * 0.35, -br * 0.35, br * 0.2, 0, 0, br);
  g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#c9d4dc');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, br, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#5b6b76'; ctx.lineWidth = 1.6; ctx.stroke();
  // pentagon patches
  ctx.fillStyle = '#21262b';
  function patch(px, py, r) {
    ctx.beginPath();
    for (var k = 0; k < 5; k++) {
      var a = -Math.PI / 2 + k * (Math.PI * 2 / 5);
      var vx = px + Math.cos(a) * r, vy = py + Math.sin(a) * r;
      if (k === 0) ctx.moveTo(vx, vy); else ctx.lineTo(vx, vy);
    }
    ctx.closePath(); ctx.fill();
  }
  patch(0, 0, br * 0.36);
  for (var m = 0; m < 5; m++) {
    var am = m * (Math.PI * 2 / 5) + 0.5;
    patch(Math.cos(am) * br * 0.82, Math.sin(am) * br * 0.82, br * 0.2);
  }
  ctx.restore();
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  if (state !== 'ready') drawHead();
  drawBall();
  // particles
  for (var i = 0; i < parts.length; i++) {
    var q = parts[i];
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // popups
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (i = 0; i < pops.length; i++) {
    var pp = pops[i];
    ctx.globalAlpha = 1 - pp.t / 0.95;
    ctx.font = '800 ' + (pp.big ? 27 : 20) + 'px system-ui, sans-serif';
    ctx.fillStyle = pp.c; ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 4;
    ctx.strokeText(pp.txt, pp.x, pp.y); ctx.fillText(pp.txt, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;
  if (flash > 0) { ctx.fillStyle = 'rgba(255,40,30,' + (flash * 0.35) + ')'; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.restore();
}

/* ============ Loop ============ */
var lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000; lastT = ts;
  if (dt > 0.05) dt = 0.05;
  if (!document.hidden) { update(dt); draw(); }
}

/* ============ Input (touch / mouse drag — the only control) ============ */
function toGame(e) {
  var r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function dragHead(e) {
  var pt = toGame(e);
  head.tx = clamp(pt.x, headR() * 0.4, W - headR() * 0.4);
  head.ty = clamp(pt.y, headR() * 0.4, H * 0.92);
}
cv.addEventListener('pointerdown', function (e) { e.preventDefault(); ac(); dragHead(e); });
cv.addEventListener('pointermove', function (e) { if (e.buttons || e.pointerType === 'touch') dragHead(e); });
document.getElementById('startBtn').addEventListener('click', function (e) { e.stopPropagation(); startCountdown(); });
document.getElementById('againBtn').addEventListener('click', function (e) { e.stopPropagation(); rpAd(function () { startCountdown(); }); });
document.getElementById('muteBtn').addEventListener('click', function (e) {
  e.stopPropagation(); muted = !muted; this.textContent = muted ? '🔇' : '🔊'; if (!muted) ac();
});
document.addEventListener('visibilitychange', function () { lastT = 0; });

resize(); reset();
requestAnimationFrame(loop);
</script>
</body>
</html>
