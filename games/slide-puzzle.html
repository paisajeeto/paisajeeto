<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Slide Puzzle — Rupiyo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Segoe UI', system-ui, sans-serif; background:#141021; color:#fff; user-select:none; -webkit-user-select:none; touch-action:none; }
  #wrap { position:fixed; inset:0; max-width:520px; margin:0 auto; }
  canvas#cv { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:0; left:0; right:0; padding:12px 14px; z-index:3; pointer-events:none; }
  #hudRow { display:flex; justify-content:space-between; align-items:center; }
  #moveBox { font-size:26px; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,.4); }
  #timeBox { font-size:16px; font-weight:800; background:rgba(0,0,0,.4); padding:7px 14px; border-radius:999px; }
  #bestBox { font-size:13px; font-weight:700; background:rgba(0,0,0,.4); padding:6px 12px; border-radius:999px; }
  #muteBtn { pointer-events:auto; background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.25); color:#fff; width:40px; height:40px; border-radius:50%; font-size:18px; cursor:pointer; }
  #ctrlBar { position:absolute; left:0; right:0; bottom:0; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); z-index:3; display:flex; gap:8px; justify-content:center; }
  .cbtn { flex:1; max-width:130px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.1); color:#fff; font-weight:800; font-size:14px; border-radius:12px; padding:11px 4px; cursor:pointer; }
  .cbtn:active { transform:scale(.95); }
  #centerMsg { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:4; pointer-events:none; text-align:center; padding:20px; }
  .panel { background:rgba(16,12,28,.95); border:1px solid rgba(255,255,255,.14); border-radius:22px; padding:24px 26px; pointer-events:auto; box-shadow:0 18px 50px rgba(0,0,0,.55); max-width:92%; max-height:88%; overflow-y:auto; }
  .panel h1 { font-size:28px; margin-bottom:4px; }
  .panel h1 span { color:#b197fc; }
  .panel .sub { opacity:.82; font-size:14px; line-height:1.55; margin-bottom:12px; }
  .panel .bigscore { font-size:52px; font-weight:800; color:#f5c542; line-height:1; }
  .panel .bestline { font-size:14px; opacity:.85; margin:6px 0 16px; line-height:1.6; }
  .btn { display:inline-block; border:none; cursor:pointer; font-weight:800; border-radius:14px; padding:13px 22px; font-size:16px; background:linear-gradient(135deg,#f5c542,#e08b00); color:#231600; box-shadow:0 5px 14px rgba(0,0,0,.35); margin:3px; }
  .btn:active { transform:scale(.96); }
  .optRow { display:flex; gap:8px; justify-content:center; margin:6px 0 12px; flex-wrap:wrap; }
  .optBtn { border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff; font-weight:800; font-size:14px; border-radius:12px; padding:10px 13px; cursor:pointer; }
  .optBtn.sel { background:linear-gradient(135deg,#9775fa,#7048e8); border-color:#b197fc; }
  .optLabel { font-size:11px; font-weight:800; letter-spacing:.08em; opacity:.75; }
  #levelMap { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:8px 0 4px; }
  .lvlNode { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.18); border-radius:12px; padding:6px 4px 7px; color:#fff; cursor:pointer; position:relative; font-family:inherit; }
  .lvlNode:active { transform:scale(.96); }
  .lvlNode canvas { width:100%; aspect-ratio:1; border-radius:8px; display:block; }
  .lvlNode .ln { font-size:11px; font-weight:800; margin-top:5px; line-height:1.3; }
  .lvlNode .st { position:absolute; top:9px; right:9px; background:rgba(0,0,0,.6); border-radius:999px; padding:2px 7px; font-size:11px; }
  .lvlNode.locked { opacity:.45; cursor:default; }
  .lvlNode.current { border-color:#f5c542; box-shadow:0 0 0 1px #f5c542; }
  #campaignBanner { font-size:15px; font-weight:800; color:#f5c542; margin:2px 0 6px; }
  #previewCv { width:132px; height:132px; border-radius:14px; border:2px solid rgba(255,255,255,.25); margin:2px auto 10px; display:block; }
  .hidden { display:none !important; }

  /* Tutorial hand hint (owner, 2026-11-10): a looping hand overlay that
     demonstrates this game's primary input — the same help Bag Toss has
     always drawn for its throw. It never blocks input (pointer-events:
     none), shows from the start screen, hides for the rest of a run on
     the player's first meaningful input, and comes back on a new run
     only when the previous run had fewer than 3 inputs (the player is
     still learning). hhRunStart() is called by the game's own start
     function; visibility is the .hhOn class. */
  #handHint { position:fixed; z-index:60; pointer-events:none; display:none; font-size:56px; line-height:1; left:50%; margin-left:-28px; top:62%; filter:drop-shadow(0 3px 6px rgba(0,0,0,.55)); will-change:transform; }
  #handHint.hhOn { display:block; }
  #handHint.hhTap { animation:hhTapK 1.15s ease-in-out infinite; }
  @keyframes hhTapK { 0%,100% { transform:translateY(0) scale(1); } 35% { transform:translateY(10px) scale(.86); } 55% { transform:translateY(10px) scale(.86); } }
  #handHint.hhHold { animation:hhHoldK 1.9s ease-in-out infinite; }
  @keyframes hhHoldK { 0%,100% { transform:translateY(0); } 22% { transform:translateY(12px); } 68% { transform:translateY(12px); } }
  #handHint.hhSteer { animation:hhSteerK 1.7s ease-in-out infinite alternate; }
  @keyframes hhSteerK { from { transform:translateX(-48px); } to { transform:translateX(48px); } }
  #handHint.hhDrag { top:auto; bottom:15%; animation:hhSteerK 1.6s ease-in-out infinite alternate; }
  #handHint.hhTrace { animation:hhTraceK 2.2s linear infinite; }
  @keyframes hhTraceK { 0% { transform:translate(0,0); } 25% { transform:translate(30px,-10px); } 50% { transform:translate(4px,-26px); } 75% { transform:translate(-28px,-10px); } 100% { transform:translate(0,0); } }
  #handHint.hhPull { left:20%; margin-left:0; top:54%; animation:hhPullK 1.8s ease-in-out infinite; }
  @keyframes hhPullK { 0%,100% { transform:translate(0,0); } 45% { transform:translate(-32px,44px); } 60% { transform:translate(-32px,44px); } 74% { transform:translate(6px,-6px); } }
  #handHint.hhConnect { animation:hhConnectK 2s ease-in-out infinite; }
  @keyframes hhConnectK { 0%,100% { transform:translateX(-54px); } 12% { transform:translateX(-54px); } 55% { transform:translateX(54px); } 70% { transform:translateX(54px); } }
  #handHint.hhRight { left:auto; right:11%; margin-left:0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="hudRow">
      <div id="moveBox">🧩 0</div>
      <div id="timeBox">⏱ 0:00</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div id="bestBox">🏆 0</div>
        <button id="muteBtn" title="Sound on/off">🔊</button>
      </div>
    </div>
  </div>
  <div id="ctrlBar">
    <button class="cbtn" id="newBtn">🔀 Shuffle</button>
    <button class="cbtn" id="peekBtn">👁 Hold to Peek</button>
    <button class="cbtn" id="menuBtn">🗺 Levels</button>
  </div>
  <div id="centerMsg">
    <div class="panel" id="menuPanel">
      <h1>🧩 Slide <span>Puzzle</span></h1>
      <div class="sub">Complete all 9 pictures to finish the campaign!<br>Tap two tiles to swap them and rebuild the picture.</div>
      <div id="campaignBanner"></div>
      <canvas id="previewCv" width="264" height="264"></canvas>
      <div class="optLabel" id="previewLabel">NEXT PICTURE</div>
      <div id="levelMap"></div>
      <button class="btn" id="startBtn">▶ Play</button>
      <button class="btn hidden" id="mixBtn">🔀 Random Mix</button>
    </div>
    <div class="panel hidden" id="wonPanel">
      <h1 id="wonTitle">🎉 Picture Complete!</h1>
      <div class="bigscore" id="finalScore">0</div>
      <div class="bestline" id="wonStats">Moves: 0 · Time: 0:00</div>
      <button class="btn hidden" id="nextBtn">Next Level ▶</button>
      <button class="btn" id="againBtn">↻ Play Again</button>
      <button class="btn" id="changeBtn">🗺 Level Map</button>
    </div>
  </div>
</div>
<script>
'use strict';
/* ============ Rupiyo score bridge ============ */
var GAME_ID = 'slide-puzzle';
try { GAME_ID = new URLSearchParams(location.search).get('rp_game') || GAME_ID; } catch (e) {}
var scoreSent = false;
function reportScore(s) {
  if (scoreSent) return; scoreSent = true;
  s = Math.max(0, Math.floor(s));
  try { parent.postMessage({ type: 'rupiyo:score', game: GAME_ID, score: s }, '*'); } catch (e) {}
  try { if (window.RupiyoBridge && window.RupiyoBridge.postScore) window.RupiyoBridge.postScore(s); } catch (e) {}
}
function rpAd(cb){ if(window.parent===window){ cb(); return; } let done=false; const fin=()=>{ if(done) return; done=true; window.removeEventListener('message',h); cb(); }; const h=e=>{ if(e.data && e.data.type==='rupiyo:ad-done') fin(); }; window.addEventListener('message',h); try{ parent.postMessage({type:'rupiyo:ad',kind:'interstitial'},'*'); }catch(_){ } setTimeout(fin,5000); }

/* ============ Audio (all synthesized) ============ */
var AC = null, muted = false;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type, vol, slideTo, delay) {
  if (muted) return; var c = ac(); if (!c) return;
  var t0 = c.currentTime + (delay || 0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(vol || 0.15, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noiseBurst(dur, vol, freq, q) {
  if (muted) return; var c = ac(); if (!c) return;
  var n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  var src = c.createBufferSource(); src.buffer = buf;
  var f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 800; f.Q.value = q || 0.8;
  var g = c.createGain(); g.gain.value = vol || 0.2;
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
}
function sfxSlide() { noiseBurst(0.07, 0.1, 1200, 1); tone(300, 0.06, 'sine', 0.06, 420); }
function sfxClick() { tone(500, 0.05, 'sine', 0.08); }
function sfxWin() { tone(523, 0.12, 'triangle', 0.15); tone(659, 0.12, 'triangle', 0.15, null, 0.11); tone(784, 0.12, 'triangle', 0.15, null, 0.22); tone(1047, 0.32, 'triangle', 0.17, null, 0.33); }

/* ============ Canvas setup ============ */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
function rr(c, x, y, w, h, rad) {
  c.beginPath();
  c.moveTo(x + rad, y);
  c.arcTo(x + w, y, x + w, y + h, rad);
  c.arcTo(x + w, y + h, x, y + h, rad);
  c.arcTo(x, y + h, x, y, rad);
  c.arcTo(x, y, x + w, y, rad);
  c.closePath();
}

/* ============ Procedural pictures (drawn once onto offscreen canvas) ============ */
var PIC = document.createElement('canvas'); PIC.width = 720; PIC.height = 720;
var picCtx = PIC.getContext('2d');
function rnd(a, b) { return a + Math.random() * (b - a); }
function drawHeroCity(g) {
  var sky = g.createLinearGradient(0, 0, 0, 720);
  sky.addColorStop(0, '#191038'); sky.addColorStop(0.45, '#4a2a7a'); sky.addColorStop(0.75, '#c65d7b'); sky.addColorStop(1, '#f7a35c');
  g.fillStyle = sky; g.fillRect(0, 0, 720, 720);
  g.fillStyle = 'rgba(255,255,255,.8)';
  for (var i = 0; i < 70; i++) { g.globalAlpha = rnd(0.25, 0.9); g.beginPath(); g.arc(rnd(0, 720), rnd(0, 380), rnd(1, 2.4), 0, 7); g.fill(); }
  g.globalAlpha = 1;
  // moon (crescent)
  g.fillStyle = '#f7ead0'; g.beginPath(); g.arc(566, 128, 46, 0, 7); g.fill();
  g.fillStyle = '#3a2166'; g.beginPath(); g.arc(592, 112, 40, 0, 7); g.fill();
  // far skyline
  g.fillStyle = '#2c1a4d';
  var x = -10;
  while (x < 720) { var bw = rnd(52, 96), bh = rnd(240, 400); g.fillRect(x, 720 - bh, bw, bh); x += bw + rnd(2, 10); }
  // lit windows (far)
  for (i = 0; i < 110; i++) { g.fillStyle = Math.random() < 0.7 ? 'rgba(255,217,122,.85)' : 'rgba(160,220,255,.8)'; g.fillRect(rnd(6, 706), rnd(330, 690), 7, 10); }
  // near skyline
  g.fillStyle = '#1a0c30'; x = -6;
  while (x < 720) { bw = rnd(80, 130); bh = rnd(150, 280); g.fillRect(x, 720 - bh, bw, bh); x += bw + rnd(4, 14); }
  for (i = 0; i < 70; i++) { g.fillStyle = 'rgba(255,217,122,.9)'; g.fillRect(rnd(6, 706), rnd(470, 700), 8, 11); }
  // rooftop foreground
  g.fillStyle = '#100722'; g.fillRect(0, 606, 720, 114);
  g.fillStyle = '#241040'; g.fillRect(0, 606, 720, 10);
  g.fillStyle = '#100722'; g.fillRect(96, 540, 54, 70); g.fillRect(88, 530, 70, 12); // water tower base block
  // hero on the rooftop (own cartoon design: navy suit, red cape)
  var hx = 372, hy = 606;
  g.fillStyle = '#8e1f2f'; // cape flowing left
  g.beginPath();
  g.moveTo(hx - 8, hy - 168);
  g.bezierCurveTo(hx - 96, hy - 150, hx - 118, hy - 84, hx - 84, hy - 8);
  g.bezierCurveTo(hx - 48, hy - 44, hx - 26, hy - 60, hx - 12, hy - 66);
  g.closePath(); g.fill();
  g.fillStyle = '#141c46'; // legs
  g.fillRect(hx - 20, hy - 92, 15, 92); g.fillRect(hx + 6, hy - 92, 15, 92);
  g.fillStyle = '#8e1f2f'; g.fillRect(hx - 22, hy - 8, 19, 9); g.fillRect(hx + 4, hy - 8, 19, 9); // boots
  g.fillStyle = '#1d2960'; rr(g, hx - 26, hy - 178, 52, 92, 14); g.fill(); // torso
  g.fillStyle = '#f5c542'; g.beginPath(); g.arc(hx, hy - 138, 11, 0, 7); g.fill(); // chest emblem
  g.fillStyle = '#1d2960'; // arms
  g.save(); g.translate(hx - 28, hy - 168); g.rotate(0.5); g.fillRect(-7, 0, 14, 74); g.restore();
  g.save(); g.translate(hx + 28, hy - 168); g.rotate(-0.28); g.fillRect(-7, 0, 14, 74); g.restore();
  g.fillStyle = '#e8b08a'; g.beginPath(); g.arc(hx, hy - 196, 17, 0, 7); g.fill(); // head
  g.fillStyle = '#141c46'; g.beginPath(); g.arc(hx, hy - 202, 17, Math.PI, 0); g.fill(); // hair/mask top
  g.fillRect(hx - 17, hy - 202, 34, 7);
  g.fillStyle = '#fff'; g.fillRect(hx - 12, hy - 199, 8, 4); g.fillRect(hx + 4, hy - 199, 8, 4); // eyes
}
function drawCozyNight(g) {
  var sky = g.createLinearGradient(0, 0, 0, 720);
  sky.addColorStop(0, '#0a1030'); sky.addColorStop(1, '#1d2b53');
  g.fillStyle = sky; g.fillRect(0, 0, 720, 720);
  g.fillStyle = '#fff';
  for (var i = 0; i < 95; i++) { g.globalAlpha = rnd(0.3, 1); g.beginPath(); g.arc(rnd(0, 720), rnd(0, 430), rnd(0.8, 2.2), 0, 7); g.fill(); }
  g.globalAlpha = 1;
  var glow = g.createRadialGradient(140, 128, 10, 140, 128, 130);
  glow.addColorStop(0, 'rgba(247,234,208,.5)'); glow.addColorStop(1, 'rgba(247,234,208,0)');
  g.fillStyle = glow; g.fillRect(0, 0, 340, 300);
  g.fillStyle = '#f7ead0'; g.beginPath(); g.arc(140, 128, 56, 0, 7); g.fill();
  g.fillStyle = 'rgba(160,140,110,.35)';
  g.beginPath(); g.arc(118, 110, 11, 0, 7); g.arc(160, 148, 8, 0, 7); g.arc(148, 102, 6, 0, 7); g.fill();
  // hills + ground
  g.fillStyle = '#101c33'; g.beginPath(); g.ellipse(140, 640, 340, 110, 0, 0, 7); g.fill();
  g.beginPath(); g.ellipse(620, 660, 320, 100, 0, 0, 7); g.fill();
  g.fillStyle = '#182a47'; g.fillRect(0, 566, 720, 154);
  g.fillStyle = 'rgba(255,255,255,.5)';
  for (i = 0; i < 40; i++) { g.beginPath(); g.arc(rnd(0, 720), rnd(580, 716), rnd(1, 2), 0, 7); g.fill(); }
  // pine trees
  function pine(px, s) {
    g.fillStyle = '#4a2c14'; g.fillRect(px - 6 * s, 566 - 26 * s, 12 * s, 26 * s);
    g.fillStyle = '#0f2f22';
    for (var t = 0; t < 3; t++) { g.beginPath(); g.moveTo(px - (44 - t * 9) * s, 566 - (20 + t * 30) * s); g.lineTo(px + (44 - t * 9) * s, 566 - (20 + t * 30) * s); g.lineTo(px, 566 - (66 + t * 30) * s); g.closePath(); g.fill(); }
  }
  pine(84, 1); pine(648, 1.15); pine(596, 0.7);
  // cottage
  g.fillStyle = '#7a4a26'; rr(g, 250, 402, 220, 164, 6); g.fill();
  g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 3;
  for (i = 0; i < 4; i++) { g.beginPath(); g.moveTo(254, 442 + i * 34); g.lineTo(466, 442 + i * 34); g.stroke(); }
  // chimney + smoke
  g.fillStyle = '#5a3a2a'; g.fillRect(414, 296, 28, 66);
  g.fillStyle = 'rgba(220,225,235,.5)';
  g.beginPath(); g.arc(430, 276, 13, 0, 7); g.arc(446, 250, 18, 0, 7); g.arc(468, 218, 24, 0, 7); g.fill();
  // roof with snowy edge
  g.fillStyle = '#4a2333';
  g.beginPath(); g.moveTo(226, 408); g.lineTo(494, 408); g.lineTo(360, 296); g.closePath(); g.fill();
  g.strokeStyle = '#eef2f7'; g.lineWidth = 13; g.lineCap = 'round';
  g.beginPath(); g.moveTo(360, 296); g.lineTo(232, 404); g.stroke();
  g.beginPath(); g.moveTo(360, 296); g.lineTo(488, 404); g.stroke();
  // warm windows
  function win(wx) {
    var wg = g.createRadialGradient(wx + 22, 462, 4, wx + 22, 462, 62);
    wg.addColorStop(0, 'rgba(255,217,122,.55)'); wg.addColorStop(1, 'rgba(255,217,122,0)');
    g.fillStyle = wg; g.fillRect(wx - 40, 400, 124, 124);
    g.fillStyle = '#ffd97a'; rr(g, wx, 440, 44, 44, 5); g.fill();
    g.strokeStyle = '#4a2c14'; g.lineWidth = 4; rr(g, wx, 440, 44, 44, 5); g.stroke();
    g.beginPath(); g.moveTo(wx + 22, 440); g.lineTo(wx + 22, 484); g.moveTo(wx, 462); g.lineTo(wx + 44, 462); g.stroke();
  }
  win(272); win(404);
  // door
  g.fillStyle = '#4a2c14'; rr(g, 336, 472, 48, 94, 6); g.fill();
  g.fillStyle = '#f5c542'; g.beginPath(); g.arc(374, 522, 4, 0, 7); g.fill();
  // path
  g.fillStyle = 'rgba(230,236,245,.16)';
  g.beginPath(); g.moveTo(344, 566); g.lineTo(376, 566); g.lineTo(404, 720); g.lineTo(316, 720); g.closePath(); g.fill();
}
function drawRainyStreet(g) {
  var sky = g.createLinearGradient(0, 0, 0, 720);
  sky.addColorStop(0, '#33415e'); sky.addColorStop(1, '#5a6c8a');
  g.fillStyle = sky; g.fillRect(0, 0, 720, 720);
  // distant buildings
  g.fillStyle = '#46536b';
  var x = -8;
  while (x < 720) { var bw = rnd(60, 110), bh = rnd(200, 360); g.fillRect(x, 500 - bh + 130, bw, bh); x += bw + rnd(3, 12); }
  g.fillStyle = 'rgba(220,230,250,.35)';
  for (var i = 0; i < 60; i++) g.fillRect(rnd(4, 708), rnd(180, 480), 6, 9);
  // street
  g.fillStyle = '#2c3444'; g.fillRect(0, 470, 720, 250);
  g.fillStyle = '#39445a'; g.fillRect(0, 470, 720, 16);
  // puddles
  g.fillStyle = 'rgba(165,195,235,.28)';
  var pud = [[130, 640, 90, 15], [420, 678, 120, 18], [600, 606, 70, 12], [250, 596, 60, 10]];
  for (i = 0; i < pud.length; i++) { g.beginPath(); g.ellipse(pud[i][0], pud[i][1], pud[i][2], pud[i][3], 0, 0, 7); g.fill(); }
  // lamps
  function lamp(lx) {
    var lg = g.createRadialGradient(lx, 306, 4, lx, 306, 96);
    lg.addColorStop(0, 'rgba(255,217,122,.75)'); lg.addColorStop(1, 'rgba(255,217,122,0)');
    g.fillStyle = lg; g.fillRect(lx - 96, 210, 192, 192);
    g.fillStyle = '#1c2230'; g.fillRect(lx - 4, 306, 8, 254);

  if (mode === 'campaign') {
    if (curLevel >= campaignUnlocked && campaignUnlocked < LEVELS.length + 1) { campaignUnlocked = curLevel + 1; saveCampaign(); campaignDoneDay = slideTodayStr(); saveCampaignDay(); }   // DAILY-LOCK: one picture per day
    document.getElementById('wonTitle').textContent = '🎉 Level ' + curLevel + ' complete!';
    stats = 'Level ' + curLevel + ' · ' + curPicName() + ' · ' + n + '×' + n + '<br>Moves: ' + moves + ' · Time: ' + fmtTime(playTime) + '<br>Best score: ' + best;
    if (curLevel === LEVELS.length) stats += '<br>🏆 Campaign Complete! Random Mix is unlocked on the map!';
    else if (nextPictureLockedToday()) stats += '<br>🗓 Next picture unlocks tomorrow — come back then!';
    document.getElementById('nextBtn').classList.toggle('hidden', curLevel >= LEVELS.length || (curLevel + 1) > campaignCap());
  } else {
    document.getElementById('wonTitle').textContent = '🎉 Picture Complete!';
    stats = '🔀 Random Mix · ' + curPicName() + ' · ' + n + '×' + n + '<br>Moves: ' + moves + ' · Time: ' + fmtTime(playTime) + '<br>Best score: ' + best;
    document.getElementById('nextBtn').classList.add('hidden');
  }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('wonStats').innerHTML = stats;
  document.getElementById('wonPanel').classList.remove('hidden');
  updateHud();
}
function burst(x, y, colors, cnt) {
  for (var i = 0; i < (cnt || 12); i++) {
    var a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 240;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.5 + Math.random() * 0.35, t: 0, c: colors[i % colors.length], r: 2.5 + Math.random() * 3.5, star: Math.random() < 0.5 });
  }
}
function confetti(x, y) {
  var cols = ['#ffd94d', '#ff6b81', '#51cf66', '#4dabf7', '#b197fc'];
  for (var i = 0; i < 52; i++) {
    var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6, v = 260 + Math.random() * 340;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.9 + Math.random() * 0.6, t: 0, c: cols[i % cols.length], r: 3 + Math.random() * 3, star: false, rect: true, rot: Math.random() * 6 });
  }
}

/* ============ Update ============ */
function update(dt) {
  time += dt;
  var i, p;
  for (i = parts.length - 1; i >= 0; i--) { p = parts[i]; p.t += dt; p.vy += 700 * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.rot !== undefined) p.rot += dt * 7; if (p.t > p.life) parts.splice(i, 1); }
  if (state === 'play' && started) { playTime += dt; if (Math.floor(playTime) !== Math.floor(playTime - dt)) updateHud(); }
  if (state === 'play' && playTime >= 480) doTimeout();
  if (anim) {
    anim.t += dt / 0.15;
    if (anim.t >= 1) {
      anim = null;
      if (pendingWin) { pendingWin = false; doWin(); }
    }
  }
}

/* ============ Draw ============ */
function drawStar(x, y, r, rot) {
  ctx.beginPath();
  for (var i = 0; i < 8; i++) {
    var a = rot + i * Math.PI / 4, rad = i % 2 === 0 ? r : r * 0.45;
    var px = x + Math.cos(a) * rad, py = y + Math.sin(a) * rad;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath(); ctx.fill();
}
function drawTile(tile, dx, dy, cell) {
  var sw = 720 / n;
  var sx = (tile % n) * sw, sy = Math.floor(tile / n) * sw;
  ctx.save();
  rr(ctx, dx + 2, dy + 2, cell - 4, cell - 4, 9);
  ctx.clip();
  ctx.drawImage(PIC, sx, sy, sw, sw, dx, dy, cell, cell);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.4;
  rr(ctx, dx + 2, dy + 2, cell - 4, cell - 4, 9); ctx.stroke();
}
function draw() {
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#141021'); bg.addColorStop(1, '#241a3f');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  var g = boardGeom();
  // board frame
  ctx.fillStyle = '#0d0a18';
  rr(ctx, g.ox - 8, g.oy - 8, g.size + 16, g.size + 16, 16); ctx.fill();
  ctx.strokeStyle = 'rgba(177,151,252,.35)'; ctx.lineWidth = 2; ctx.stroke();

  if (peekHeld && state === 'play') {
    ctx.save();
    rr(ctx, g.ox, g.oy, g.size, g.size, 10); ctx.clip();
    ctx.drawImage(PIC, g.ox, g.oy, g.size, g.size);
    ctx.restore();
    ctx.font = '800 15px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.fillText('👁 PEEK', W / 2, g.oy + g.size + 28);
  } else {
    for (var i = 0; i < n * n; i++) {
      var cx = g.ox + (i % n) * g.cell, cy = g.oy + Math.floor(i / n) * g.cell;
      if (anim && (i === anim.a || i === anim.b)) {
        ctx.fillStyle = '#1b1530';
        rr(ctx, cx + 2, cy + 2, g.cell - 4, g.cell - 4, 9); ctx.fill();
        continue;
      }
      drawTile(board[i], cx, cy, g.cell);
      if (i === sel && !anim && state === 'play') {
        ctx.strokeStyle = 'rgba(245,197,66,' + (0.75 + Math.sin(time * 6) * 0.25) + ')';
        ctx.lineWidth = 4;
        rr(ctx, cx + 3, cy + 3, g.cell - 6, g.cell - 6, 9); ctx.stroke();
      }
    }
    if (anim) {
      var t = Math.min(1, anim.t), e = 1 - (1 - t) * (1 - t);
      drawTile(anim.tileA, anim.ax + (anim.bx - anim.ax) * e, anim.ay + (anim.by - anim.ay) * e, g.cell);
      drawTile(anim.tileB, anim.bx + (anim.ax - anim.bx) * e, anim.by + (anim.ay - anim.by) * e, g.cell);
    }
    if (state === 'won') {
      ctx.save();
      rr(ctx, g.ox, g.oy, g.size, g.size, 10); ctx.clip();
      ctx.drawImage(PIC, g.ox, g.oy, g.size, g.size);
      ctx.restore();
    }
  }
  // particles
  for (i = 0; i < parts.length; i++) {
    var q = parts[i];
    ctx.globalAlpha = 1 - q.t / q.life; ctx.fillStyle = q.c;
    if (q.rect) { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot || 0); ctx.fillRect(-q.r, -q.r * 0.6, q.r * 2, q.r * 1.2); ctx.restore(); }
    else if (q.star) drawStar(q.x, q.y, q.r * 2, q.t * 6);
    else { ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

/* ============ Loop ============ */
var lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  if (!lastT) lastT = ts;
  var dt = (ts - lastT) / 1000; lastT = ts;
  if (dt > 0.05) dt = 0.05;
  if (!document.hidden) { update(dt); draw(); }
}

/* ============ Input ============ */
cv.addEventListener('pointerdown', function (e) {
  e.preventDefault(); ac();
  if (state !== 'play') return;
  var rect = cv.getBoundingClientRect();
  var x = e.clientX - rect.left, y = e.clientY - rect.top;
  var g = boardGeom();
  var c = Math.floor((x - g.ox) / g.cell), r = Math.floor((y - g.oy) / g.cell);
  if (r < 0 || c < 0 || r >= n || c >= n) return;
  tapTile(r * n + c);
});
document.getElementById('startBtn').addEventListener('click', function () { ac(); if (!campaignComplete()) startLevel(campaignUnlocked); });
document.getElementById('mixBtn').addEventListener('click', function () { ac(); sfxClick(); startMix(); });
document.getElementById('nextBtn').addEventListener('click', function () { sfxClick(); rpAd(function () { startLevel(curLevel + 1); }); });
document.getElementById('againBtn').addEventListener('click', function () { sfxClick(); rpAd(function () { startPuzzle(); }); });
document.getElementById('changeBtn').addEventListener('click', function () { sfxClick(); showMenu(); });
document.getElementById('newBtn').addEventListener('click', function () { if (state === 'play' || state === 'won') { sfxClick(); rpAd(function () { startPuzzle(); }); } });
document.getElementById('menuBtn').addEventListener('click', function () { sfxClick(); showMenu(); });
var peekBtn = document.getElementById('peekBtn');
peekBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); peekHeld = true; });
peekBtn.addEventListener('pointerup', function () { peekHeld = false; });
peekBtn.addEventListener('pointerleave', function () { peekHeld = false; });
peekBtn.addEventListener('pointercancel', function () { peekHeld = false; });
document.getElementById('muteBtn').addEventListener('click', function (e) {
  e.stopPropagation(); muted = !muted; this.textContent = muted ? '🔇' : '🔊'; if (!muted) ac();
});
document.addEventListener('visibilitychange', function () { lastT = 0; });

resize();
curLevel = Math.min(campaignUnlocked, LEVELS.length);
selTheme = levelThemeOf(LEVELS[curLevel - 1]); selSize = LEVELS[curLevel - 1].size; selImage = LEVELS[curLevel - 1].image || null;
board = solvedBoard(); n = selSize;
showPicture(LEVELS[curLevel - 1]);
renderLevelMap();
updateHud();
requestAnimationFrame(loop);

/* ============ Config-driven levels (owner, 2026-11-10) ============
   The live config may carry levels['slide-puzzle'] — campaign entries
   in this game's own format ({theme, size} per picture, or a custom
   picture {image, size} with the theme optional). When present and
   EVERY entry validates (size 3 or 4, and either a non-empty image
   string or a theme that is one of this game's scenes), the list
   replaces the built-in LEVELS and the map is re-rendered; anything
   else (offline, missing key, one bad entry) silently keeps the
   built-ins, so a bad config can never break the game. Applied only
   from the menu — a puzzle in progress is never swapped under the
   player. */
var PJ_CFG_URL = 'https://paisajeeto.github.io/paisajeeto/config.json';
window.__pjLevelsSource = 'builtin';
function pjValidSlideLevels(a) {
  if (!Array.isArray(a) || !a.length) return false;
  for (var i = 0; i < a.length; i++) {
    var e = a[i];
    if (!e || typeof e !== 'object' || Array.isArray(e)) return false;
    var hasImage = typeof e.image === 'string' && e.image.length > 0;
    if (!hasImage && !Object.prototype.hasOwnProperty.call(SCENES, e.theme)) return false;
    if (e.size !== 3 && e.size !== 4) return false;
  }
  return true;
}
function pjApplySlideLevels(a) {
  if (state !== 'menu') return false;
  LEVELS = a;
  if (campaignUnlocked > LEVELS.length + 1) { campaignUnlocked = LEVELS.length + 1; saveCampaign(); }
  curLevel = Math.min(campaignUnlocked, LEVELS.length);
  selTheme = levelThemeOf(LEVELS[curLevel - 1]); selSize = LEVELS[curLevel - 1].size; selImage = LEVELS[curLevel - 1].image || null;
  n = selSize; board = solvedBoard();
  window.__pjLevelsSource = 'config';
  showMenu();
  return true;
}
(function pjLoadLevels() {
  if (typeof fetch !== 'function') return;
  var ctl = null;
  try {
    if ('AbortController' in window) {
      ctl = new AbortController();
      setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 2500);
    }
  } catch (e) {}
  fetch(PJ_CFG_URL, { cache: 'no-store', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.json(); })
    .then(function (cfg) {
      try { if (cfg && cfg.levels && pjValidSlideLevels(cfg.levels['slide-puzzle'])) pjApplySlideLevels(cfg.levels['slide-puzzle']); } catch (e) {}
    })
    .catch(function () {});
})();
</script>
<div id="handHint" class="hhOn hhTap">👆</div>

<script>
/* Tutorial hand hint observer (owner, 2026-11-10): passive listeners
   only — the game's own input handlers are untouched. A pointerdown
   anywhere except on a UI button/panel counts as a meaningful input,
   as do Space/arrow keys. The first input of a run hides the hand for
   the rest of that run; hhRunStart() (called from the game's start
   function) opens a new run and re-shows the hand only if the
   previous run had fewer than 3 inputs. */
var hhEl = document.getElementById('handHint');
var hhInputs = 0, hhLive = false;
function hhRunStart(){ var prev = hhInputs; hhInputs = 0; hhLive = true; if (hhEl) hhEl.classList.toggle('hhOn', prev < 3); }
function hhNoteInput(){ if (!hhLive) return; hhInputs++; if (hhEl) hhEl.classList.remove('hhOn'); }
document.addEventListener('pointerdown', function (e) { var t = e.target; if (t && t.closest && t.closest('button, .panel, input, select, a')) return; hhNoteInput(); }, true);
document.addEventListener('keydown', function (e) { if (e.code === 'Space' || e.code.indexOf('Arrow') === 0) hhNoteInput(); }, true);
</script>
